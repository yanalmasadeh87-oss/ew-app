// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
function show(h){ document.getElementById('main').innerHTML = h; }
function fp(p){
  if(!p && p!==0) return 'N/A';
  if(p>=1000) return '$'+Math.round(p).toLocaleString();
  if(p>=1)    return '$'+p.toFixed(4);
  if(p>=0.01) return '$'+p.toFixed(5);
  return '$'+p.toFixed(7);
}
function fpc(p){ return (p>=0?'+':'')+p.toFixed(2)+'%'; }
function pct(a,b){ return b>0 ? ((a-b)/b*100).toFixed(1) : '0.0'; }

function getInterval(){
  if(mode==='scalp') return '4h';
  if(days<=90)       return '4h';
  return '1d';
}
function getLimit(){
  if(mode==='scalp') return 540;
  if(days===1000)    return 1000;
  return days;
}

function loadSym(s){
  sym = s.toUpperCase()+'USDT'; coinSym = s.toUpperCase();
  document.getElementById('inp').value = s.toUpperCase();
  fetchData();
}
function doSearch(){
  var v = document.getElementById('inp').value.trim().toUpperCase();
  if(!v) return;
  coinSym = v; sym = v+'USDT'; fetchData();
}
function setMode(m){
  mode = m;

  document.getElementById('m-scalp').classList.toggle('on', m==='scalp');

function fetchData(){
  show('<div class="info">Loading '+coinSym+'/USDT from Binance...<br>Please wait</div>');
  var urlK   = BN+'/klines?symbol='+sym+'&interval='+getInterval()+'&limit='+getLimit();
  var url24  = BN+'/ticker/24hr?symbol='+sym;
  var urlMax = BN+'/klines?symbol='+sym+'&interval=1w&limit=200';
  Promise.all([
    fetch(urlK).then(function(r){return r.json();}),
    fetch(url24).then(function(r){return r.json();}),
    fetch(urlMax).then(function(r){return r.json();})
  ]).then(function(res){
    var klines=res[0], stats=res[1], maxK=res[2];
    if(maxK && maxK.length && !maxK.code)
      globalATH = Math.max.apply(null, maxK.map(function(k){return parseFloat(k[2]);}));
    if(!klines || !klines.length || klines.code){
      show('<div class="err">❌ Symbol not found on Binance.<br>Try: BTC, ETH, XRP, SOL, BNB...</div>');
      return;
    }
    priceData = klines.map(function(k){
      return { date:new Date(k[0]), open:parseFloat(k[1]), high:parseFloat(k[2]),
               low:parseFloat(k[3]), price:parseFloat(k[4]), vol:parseFloat(k[5]) };
    });
    volData = priceData.map(function(d){ return d.vol; });
    renderPage(stats);
  }).catch(function(e){
    show('<div class="err">❌ API Error: '+e.message+'</div>');
  });
}

// ─────────────────────────────────────────────────────────────
// INDICATORS (unchanged from original)
// ─────────────────────────────────────────────────────────────
function calcRSI(prices){
  var period=14;
  if(prices.length<period+1) return 50;
  var ag=0,al=0,i,d;
  for(i=1;i<=period;i++){ d=prices[i]-prices[i-1]; if(d>0)ag+=d; else al+=Math.abs(d); }
  ag/=period; al/=period;
  for(i=period;i<prices.length;i++){
    d=prices[i]-prices[i-1];
    ag=(ag*13+(d>0?d:0))/14;
    al=(al*13+(d<0?Math.abs(d):0))/14;
  }
  return al===0?100:100-(100/(1+ag/al));
}
function calcEMA(prices,period){
  if(prices.length<period) return [];
  var k=2/(period+1),sum=0,i;
  for(i=0;i<period;i++) sum+=prices[i];
  var r=[sum/period];
  for(i=period;i<prices.length;i++) r.push(prices[i]*k+r[r.length-1]*(1-k));
  return r;
}
function calcMACD(prices){
  if(prices.length<35) return {cross:false,turning:false,hist:0,histLine:[]};
  var ef=calcEMA(prices,12),es=calcEMA(prices,26),ml=[],i;
  for(i=0;i<es.length;i++) ml.push(ef[i+14]-es[i]);
  if(ml.length<9) return {cross:false,turning:false,hist:0,histLine:[]};
  var sl=calcEMA(ml,9),diff=ml.length-sl.length,hist=[];
  for(i=0;i<sl.length;i++) hist.push(ml[i+diff]-sl[i]);
  var h=hist[hist.length-1]||0,ph=hist[hist.length-2]||0;
  return {cross:h>0&&ph<=0,turning:h>ph,hist:h,prev:ph,histLine:hist};
}
function calcStoch(prices,period){
  period=period||14;
  if(prices.length<period) return 50;
  var sl=prices.slice(-period),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl);
  if(high===low) return 50;
  return ((prices[prices.length-1]-low)/(high-low))*100;
}
function calcEWO(prices){
  if(prices.length<35) return 0;
  var m5=0,m35=0,i;
  for(i=prices.length-5;i<prices.length;i++) m5+=prices[i];
  for(i=prices.length-35;i<prices.length;i++) m35+=prices[i];
  return m5/5-m35/35;
}
function calcSMI(prices,period){
  period=period||14;
  if(prices.length<period) return 0;
  var result=[],i;
  for(i=period-1;i<prices.length;i++){
    var sl=prices.slice(i-period+1,i+1),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl),mid=(high+low)/2,range=high-low;
    result.push(range>0?((prices[i]-mid)/(range/2))*100:0);
  }
  var smoothed=calcEMA(result,3);
  return smoothed.length>0?smoothed[smoothed.length-1]:0;
}
function calcSMIFull(prices,period){
  period=period||14;
  var result=[],i;
  for(i=period-1;i<prices.length;i++){
    var sl=prices.slice(i-period+1,i+1),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl),mid=(high+low)/2,range=high-low;
    result.push(range>0?((prices[i]-mid)/(range/2))*100:0);
  }
  return calcEMA(result,3);
}
function calcMA50(prices){
  if(prices.length<50) return prices[prices.length-1]||0;
  var sum=0,i; for(i=prices.length-50;i<prices.length;i++) sum+=prices[i];
  return sum/50;
}
function volumeAnalysis(vols){
  if(vols.length<10) return {declining:false,expanding:false};
  var r5=0,p5=0,i;
  for(i=vols.length-5;i<vols.length;i++) r5+=vols[i];
  for(i=vols.length-10;i<vols.length-5;i++) p5+=vols[i];
  return { declining:(r5/5)<(p5/5), expanding:vols[vols.length-1]>(r5/5)*1.2 };
}

// ─────────────────────────────────────────────────────────────
// PIVOT DETECTION
// Adaptive window — tries 5 then 3 if not enough pivots
// ─────────────────────────────────────────────────────────────
function findPivots(highs, lows, window){
  window = window || 5;
  var n=highs.length, pivots=[], i, win;
  for(win=window; win>=3; win--){
    pivots=[];
    for(i=win;i<n-win;i++){
      var isH=true,isL=true,j;
      for(j=1;j<=win;j++){
        if(highs[i]<highs[i-j]||highs[i]<highs[i+j]) isH=false;
        if(lows[i]>lows[i-j]||lows[i]>lows[i+j])     isL=false;
      }
      if(isH) pivots.push({idx:i,price:highs[i],type:'H'});
      else if(isL) pivots.push({idx:i,price:lows[i],type:'L'});
    }
    if(pivots.length>=8) break;
  }
  return pivots;
}

// ─────────────────────────────────────────────────────────────
// EW RULE VALIDATION
// ─────────────────────────────────────────────────────────────
function validateEWRules(w0,w1h,w2l,w3h,w4l,w5h){
  var issues=[];
  var w1=w1h-w0;
  if(w1<=0){ return {valid:false,issues:['W1 range zero']}; }
  if(w2l<=w0)        issues.push('W2 > 100% of W1');
  var w3=w3h-w2l, w5=w5h-w4l;
  if(w3<=0)          issues.push('W3 range zero');
  else if(w3<w1&&w3<w5) issues.push('W3 is shortest wave');
  if(w4l<=w1h)       issues.push('W4 overlaps W1');
  if(w5h<=w3h)       issues.push('W5 below W3 top');
  return {valid:issues.length===0, issues:issues};
}

function fibQuality(retrace){
  if(retrace>=0.618&&retrace<=0.786) return {label:'GOLDEN (61.8–78.6%)',valid:true,golden:true};
  if(retrace>=0.500&&retrace<0.618)  return {label:'GOOD (50–61.8%)',valid:true,golden:false};
  if(retrace>=0.382&&retrace<0.500)  return {label:'VALID (38.2–50%)',valid:true,golden:false};
  if(retrace>0.786&&retrace<=1.000)  return {label:'DEEP (78.6–100%)',valid:true,golden:false};
  return {label:'INVALID ('+( retrace*100).toFixed(0)+'%)',valid:false,golden:false};
}

// ─────────────────────────────────────────────────────────────
// STRUCTURE DETECTORS
// Each returns a structure object or null
// ─────────────────────────────────────────────────────────────

// ── 1. Standard EW — W4 entry (active impulse) ───────────────
function detectStandardEW_W4(pivots, current){
  if(pivots.length<5) return null;
  for(var i=pivots.length-5;i>=0;i--){
    var p=pivots.slice(i,i+5);
    if(p.length<5) continue;
    var types=p.map(function(x){return x.type;}).join('');
    if(types!=='LHLHL') continue;
    var w0=p[0].price,w1h=p[1].price,w2l=p[2].price,w3h=p[3].price,w4l=p[4].price;
    var w1=w1h-w0,w3=w3h-w2l;
    if(w1<=0||w3<=0) continue;
    if(w2l<=w0)      continue;
    if(w3<w1)        continue;
    if(w4l<=w1h)     continue;
    if(Math.abs(current-w4l)/w4l>0.05) continue;
    var w2ret=(w1h-w2l)/w1, w4ret=(w3h-w4l)/w3;
    var fib=fibQuality(w2ret);
    // Swing TPs: structure-based
    return {
      type:'STANDARD_EW_W4',
      w0:w0,w1h:w1h,w2l:w2l,w3h:w3h,w4l:w4l,w5h:null,
      w1:w1,w3:w3,
      w2ret:w2ret,w4ret:w4ret,
      fibLabel:fib.label,fibValid:fib.valid,fibGolden:fib.golden,
      entryPrice:w4l, structLow:w4l,
      entryWave:'W4',
      // Swing levels from actual wave structure
      swingSL:  w4l*0.98,
      swingTP1: w3h,                // W3 top — first resistance
      swingTP2: w4l+w1*1.618,       // 1.618×W1 — W5 projection
      swingTP3: w4l+w1*2.0,
      swingTP4: w4l+w1*2.618,
      tp1Lbl:'W3 high retest',
      tp2Lbl:'1.618×W1 (W5 proj)',
      tp3Lbl:'2.0×W1',
      tp4Lbl:'2.618×W1',
      slLbl:'2% below W4 low',
      applySit:['waveCount','goldenRatio','alternation','blueBox','stoch','smi','ewo','volDec','volExp']
    };
  }
  return null;
}

// ── 2. Standard EW — W2 entry (after full impulse) ───────────
function detectStandardEW_W2(pivots, current){
  if(pivots.length<6) return null;
  for(var i=pivots.length-6;i>=0;i--){
    var p=pivots.slice(i,i+6);
    if(p.length<6) continue;
    var types=p.map(function(x){return x.type;}).join('');
    if(types!=='LHLHLH') continue;
    var w0=p[0].price,w1h=p[1].price,w2l=p[2].price,w3h=p[3].price,w4l=p[4].price,w5h=p[5].price;
    var res=validateEWRules(w0,w1h,w2l,w3h,w4l,w5h);
    if(!res.valid) continue;
    if(Math.abs(current-w2l)/w2l>0.05) continue;
    var w1=w1h-w0, w2ret=(w1h-w2l)/w1;
    var fib=fibQuality(w2ret);
    return {
      type:'STANDARD_EW_W2',
      w0:w0,w1h:w1h,w2l:w2l,w3h:w3h,w4l:w4l,w5h:w5h,
      w1:w1,w3:w3h-w2l,
      w2ret:w2ret,
      fibLabel:fib.label,fibValid:fib.valid,fibGolden:fib.golden,
      entryPrice:w2l, structLow:w2l,
      entryWave:'W2',
      swingSL:  w2l*0.98,
      swingTP1: w1h,                // W1 top retest
      swingTP2: w2l+w1*1.618,       // 1.618×W1
      swingTP3: w2l+w1*2.618,
      swingTP4: w5h,                // prior W5 top
      tp1Lbl:'W1 high retest',
      tp2Lbl:'1.618×W1 (W3 target)',
      tp3Lbl:'2.618×W1',
      tp4Lbl:'Prior W5 top',
      slLbl:'2% below W2 low',
      applySit:['waveCount','goldenRatio','waveSym','stoch','smi','ewo','volDec','volExp']
    };
  }
  return null;
}

// ── 3. ABC Zigzag — completed impulse + 5-3-5 correction ─────
function detectABCZigzag(pivots, current){
  if(pivots.length<8) return null;
  // Find completed impulse
  var impulse=null, w5idx=0;
  for(var i=pivots.length-6;i>=0;i--){
    var p=pivots.slice(i,i+6);
    if(p.length<6) continue;
    var types=p.map(function(x){return x.type;}).join('');
    if(types!=='LHLHLH') continue;
    var res=validateEWRules(p[0].price,p[1].price,p[2].price,p[3].price,p[4].price,p[5].price);
    if(res.valid){ impulse=p; w5idx=p[5].idx; break; }
  }
  if(!impulse) return null;
  var w5h=impulse[5].price;
  var post=pivots.filter(function(p){return p.idx>w5idx;});
  if(post.length<2) return null;
  // Wave A — first Low after W5
  var aP=null; for(var j=0;j<post.length;j++){ if(post[j].type==='L'){aP=post[j];break;} }
  if(!aP) return null;
  var waBot=aP.price, waRange=w5h-waBot;
  if(waRange/w5h<0.08) return null;
  // Wave B — first High after A (zigzag: 38–78% retrace of A)
  var postA=post.filter(function(p){return p.idx>aP.idx;});
  var bP=null; for(var j=0;j<postA.length;j++){ if(postA[j].type==='H'){bP=postA[j];break;} }
  if(!bP) return null;
  var wbTop=bP.price, wbRet=(wbTop-waBot)/waRange;
  if(wbRet<0.38||wbRet>0.78) return null;
  // Wave C — first Low after B (or current if developing)
  var postB=post.filter(function(p){return p.idx>bP.idx;});
  var cP=null; for(var j=0;j<postB.length;j++){ if(postB[j].type==='L'){cP=postB[j];break;} }
  var cDev=(cP===null);
  var wcBot=cDev?current:cP.price;
  var wcRange=wbTop-wcBot;
  if(wcRange<=0) return null;
  var cProgress=wcRange/waRange*100;
  if(cProgress<70) return null;
  var cTarget=wbTop-waRange;
  var cConfirmed=Math.abs(wcBot-cTarget)/Math.max(Math.abs(cTarget),0.0001)<0.05;
  return {
    type:'ABC_ZIGZAG',
    w5h:w5h, waBot:waBot, waRange:waRange,
    wbTop:wbTop, wbRetPct:(wbRet*100).toFixed(1),
    wcBot:wcBot, wcRange:wcRange, cDev:cDev,
    cTarget:cTarget, cProgress:cProgress.toFixed(1), cConfirmed:cConfirmed,
    entryPrice:wcBot, structLow:wcBot,
    entryWave:'Wave C',
    swingSL:  wcBot*0.98,
    swingTP1: wbTop,                    // Wave B top
    swingTP2: w5h,                      // W5 top (correction origin)
    swingTP3: wcBot+waRange*1.618,      // 1.618×A from C
    swingTP4: wcBot+waRange*2.618,      // 2.618×A from C
    tp1Lbl:'Wave B top',
    tp2Lbl:'W5 top (correction origin)',
    tp3Lbl:'1.618×Wave A from C',
    tp4Lbl:'2.618×Wave A from C',
    slLbl:'2% below Wave C low',
    applySit:['waveCBot','cEqA','abcStruct','stoch','smi','ewo','volDec','volExp']
  };
}

// ── 4. Expanded Flat — B exceeds W5 top ──────────────────────
function detectExpandedFlat(pivots, current){
  if(pivots.length<8) return null;
  var impulse=null, w5idx=0;
  for(var i=pivots.length-6;i>=0;i--){
    var p=pivots.slice(i,i+6);
    if(p.length<6) continue;
    var types=p.map(function(x){return x.type;}).join('');
    if(types!=='LHLHLH') continue;
    var res=validateEWRules(p[0].price,p[1].price,p[2].price,p[3].price,p[4].price,p[5].price);
    if(res.valid){ impulse=p; w5idx=p[5].idx; break; }
  }
  if(!impulse) return null;
  var w5h=impulse[5].price;
  var post=pivots.filter(function(p){return p.idx>w5idx;});
  if(post.length<3) return null;
  var aP=null; for(var j=0;j<post.length;j++){ if(post[j].type==='L'){aP=post[j];break;} }
  if(!aP) return null;
  var waBot=aP.price, waRange=w5h-waBot;
  if(waRange<=0) return null;
  var postA=post.filter(function(p){return p.idx>aP.idx;});
  var bP=null; for(var j=0;j<postA.length;j++){ if(postA[j].type==='H'){bP=postA[j];break;} }
  if(!bP) return null;
  var wbTop=bP.price;
  // KEY: B must exceed W5 top (expanded flat signature)
  if(wbTop<=w5h) return null;
  var wbRet=(wbTop-waBot)/waRange; // will be >1.0
  var postB=post.filter(function(p){return p.idx>bP.idx;});
  var cP=null; for(var j=0;j<postB.length;j++){ if(postB[j].type==='L'){cP=postB[j];break;} }
  var cDev=(cP===null);
  var wcBot=cDev?current:cP.price;
  var wcRange=wbTop-wcBot;
  if(wcRange<=0) return null;
  var cVsA=wcRange/waRange;
  var cProgress=Math.min(cVsA/1.236*100,100);
  if(cProgress<70) return null;
  var cT1236=wbTop-waRange*1.236, cT1618=wbTop-waRange*1.618;
  return {
    type:'EXPANDED_FLAT',
    w5h:w5h, waBot:waBot, waRange:waRange,
    wbTop:wbTop, wbRetPct:(wbRet*100).toFixed(1),
    wcBot:wcBot, wcRange:wcRange, cDev:cDev,
    cVsAPct:(cVsA*100).toFixed(1), cProgress:cProgress.toFixed(1),
    cT1236:cT1236, cT1618:cT1618,
    entryPrice:wcBot, structLow:wcBot,
    entryWave:'Wave C',
    swingSL:  wcBot*0.98,
    swingTP1: waBot,                    // Wave A bottom
    swingTP2: wbTop,                    // Wave B top (new high)
    swingTP3: wcBot+waRange*1.618,
    swingTP4: wcBot+waRange*2.0,
    tp1Lbl:'Wave A bottom',
    tp2Lbl:'Wave B top (new high)',
    tp3Lbl:'1.618×Wave A from C',
    tp4Lbl:'2.0×Wave A from C',
    slLbl:'2% below Wave C low',
    applySit:['waveCBot','abcStruct','stoch','smi','ewo','volDec','volExp']
  };
}

// ── 6. W-X-Y-X-Z Triple Combination ──────────────────────────
function detectWXYXZ(pivots, current){
  if(pivots.length<10) return null;
  for(var i=pivots.length-10;i>=0;i--){
    var seg=pivots.slice(i,i+10);
    if(seg.length<10) continue;
    var types=seg.slice(0,5).map(function(x){return x.type;}).join('');
    if(types!=='HLHLH') continue;
    var wTop=seg[0].price, wBot=seg[1].price;
    var x1Top=seg[2].price, yBot=seg[3].price, x2Top=seg[4].price;
    var x1Range=x1Top-wBot, x2Range=x2Top-yBot;
    var x1Time=seg[2].idx-seg[1].idx, x2Time=seg[4].idx-seg[3].idx;
    if(x1Range<=0||x1Time<=0) continue;
    // X moves must be >5%
    if(wBot>0&&x1Range/wBot<0.05) continue;
    if(yBot>0&&x2Range/yBot<0.05) continue;
    // X smaller than W and Y
    if(x1Range>=(wTop-wBot)*0.8||x1Range>=(x1Top-yBot)*0.8) continue;
    // KEY: X1=X2 within 15% both price and time
    var priceRat=x2Range/x1Range, timeRat=x2Time/x1Time;
    if(priceRat<0.85||priceRat>1.15||timeRat<0.85||timeRat>1.15) continue;
    // Z wave — lowest Low after X2 top
    var postX2=pivots.filter(function(p){return p.idx>seg[4].idx;});
    var zP=null; for(var j=0;j<postX2.length;j++){ if(postX2[j].type==='L'){zP=postX2[j];break;} }
    var zDev=(zP===null), zBot=zDev?current:zP.price;
    if(!zDev&&zBot>=yBot) continue;
    var moveUp=wTop-wBot;
    return {
      type:'WXYXZ',
      wTop:wTop, wBot:wBot, x1Top:x1Top, yBot:yBot, x2Top:x2Top,
      zBot:zBot, zDev:zDev,
      x1Range:x1Range, x2Range:x2Range,
      priceDiffPct:((Math.abs(x1Range-x2Range)/x1Range)*100).toFixed(1),
      timeDiffPct:((Math.abs(x1Time-x2Time)/x1Time)*100).toFixed(1),
      x1EqX2:true,
      entryPrice:zBot, structLow:zBot,
      entryWave:'Wave Z',
      swingSL:  zBot*0.98,
      swingTP1: x2Top,                  // X2 top
      swingTP2: wTop,                   // W origin
      swingTP3: wTop+moveUp*0.618,
      swingTP4: wTop+moveUp*1.0,
      tp1Lbl:'X2 top (connector high)',
      tp2Lbl:'W origin (correction start)',
      tp3Lbl:'W top + 0.618×W range',
      tp4Lbl:'W top + 1.0×W range',
      slLbl:'2% below Z wave low',
      applySit:['wxyxzX1X2','waveCount','stoch','smi','ewo','volDec','volExp']
    };
  }
  return null;
}

// ─────────────────────────────────────────────────────────────
// STRUCTURE RECOGNIZER
// Priority: rarest first, most common last
// ─────────────────────────────────────────────────────────────
function recognizeStructure(pivots, current){
  var s;
  s=detectWXYXZ(pivots,current);         if(s) return s;
  s=detectExpandedFlat(pivots,current);  if(s) return s;
  s=detectRunningCorrection(pivots,current); if(s) return s;
  s=detectABCZigzag(pivots,current);     if(s) return s;
  s=detectStandardEW_W4(pivots,current); if(s) return s;
  s=detectStandardEW_W2(pivots,current); if(s) return s;
  return null;
}

    // Fib check — adapts per structure
    buildFibCheck(structure),

  var allSit = [
    { key:'waveCount',  l:'Wave Count Verified >60%',
      ok: structure&&structure.w3&&structure.w1&&(structure.w3/structure.w1)>1.0, cat:'EW',

      ok: structure&&structure.cProgress&&parseFloat(structure.cProgress)>=80, cat:'EW',
      note:'ABC corrections only' },
    { key:'cEqA', l:'C=A Price Confirmed',
      ok: structure&&structure.cConfirmed===true, cat:'Fib',
      note:'ABC corrections only' },
    { key:'wxyxzX1X2', l:'WXYXZ X1=X2 (Price+Time)',
      ok: structure&&structure.x1EqX2===true, cat:'EW',
      note:'Triple combo only' },
    { key:'abcStruct', l:'ABC Structure',
      ok: stype==='ABC_ZIGZAG'||stype==='EXPANDED_FLAT'||stype==='RUNNING_CORRECTION', cat:'Struct',
      note:'Corrective patterns only' },
    { key:'stoch', l:'Stoch Below 25 ('+stoch.toFixed(0)+')',
      ok: stoch<25, cat:'Mom', note:'' },
    { key:'smi', l:'SMI Below -40 ('+smi.toFixed(0)+')',
      ok: smi<-40, cat:'Mom', note:'' },
    { key:'ewo', l:'EWO Signal',
      ok: ewoVal>0, cat:'Mom', note:'' },
    { key:'volDec', l:'Volume Declining (correction)',
      ok: volRes.declining, cat:'Vol', note:'' },
    { key:'volExp', l:'Volume Expanding (reversal)',
      ok: volRes.expanding, cat:'Vol', note:'' },
    { key:'alternation', l:'Alternation W2≠W4',
      ok: structure&&structure.w2ret&&structure.w4ret&&Math.abs(structure.w2ret-structure.w4ret)>0.15,
      cat:'Struct', note:'When W4 exists' },
    { key:'waveSym', l:'Wave Symmetry (W3>W1, W5<W3)',
      ok: structure&&structure.w1&&structure.w3&&structure.w3>structure.w1, cat:'Struct',
      note:'When W5 complete' },
    { key:'blueBox', l:'Blue Box Zone (0.618–0.786)',
      ok: structure&&structure.w2ret&&structure.w2ret>=0.618&&structure.w2ret<=0.786,
      cat:'Struct', note:'When Fib box forms' },
  ];

  // Mark each situational as applicable or N/A
  var sit = allSit.map(function(s){
    var applicable = apply.indexOf(s.key)>=0;
    return { l:s.l, ok:applicable?s.ok:false, applicable:applicable, cat:s.cat, note:s.note };
  });

  var reqPass = req.filter(function(r){return r.ok;}).length;
  var sitApplicable = sit.filter(function(s){return s.applicable;});
  var sitPass = sitApplicable.filter(function(s){return s.ok;}).length;
  var sitNA   = sit.filter(function(s){return !s.applicable;}).length;

  return { req:req, sit:sit, reqPass:reqPass, reqTotal:req.length, sitPass:sitPass, sitTotal:sitApplicable.length, sitNA:sitNA };
}

function buildFibCheck(s){
  if(!s) return {l:'Fib / Structure Check',ok:false,cat:'Fib'};
  var t=s.type;
  if(t==='STANDARD_EW_W4'||t==='STANDARD_EW_W2')
    return {l:'W2 Fib 38–100%: '+(s.fibLabel||''),ok:s.fibValid,cat:'Fib'};
  if(t==='ABC_ZIGZAG')
    return {l:'C=A Progress ≥70% ('+s.cProgress+'%)',ok:parseFloat(s.cProgress)>=70,cat:'Fib'};
  if(t==='EXPANDED_FLAT')
    return {l:'C Progress ≥70% (1.236×A) ('+s.cProgress+'%)',ok:parseFloat(s.cProgress)>=70,cat:'Fib'};
  if(t==='RUNNING_CORRECTION')
    return {l:'C Above A Bottom (Higher Low)',ok:s.higherLow===true,cat:'Fib'};
  if(t==='WXYXZ')
    return {l:'X1=X2 Confirmed (Price+Time)',ok:s.x1EqX2===true,cat:'Fib'};
  return {l:'Structure Check',ok:false,cat:'Fib'};
}

function findPivotsLegacy(prices,minMove){
  minMove=minMove||0.10;
  var n=prices.length,win=Math.max(3,Math.floor(n/20)),pivots=[],i,sl,mx,mn;
  for(i=win;i<n-win;i++){
    sl=prices.slice(i-win,i+win+1);mx=Math.max.apply(null,sl);mn=Math.min.apply(null,sl);
    if(prices[i]===mx&&prices[i]>prices[i-1]&&prices[i]>prices[i+1])
      pivots.push({idx:i,price:prices[i],type:'peak'});
    else if(prices[i]===mn&&prices[i]<prices[i-1]&&prices[i]<prices[i+1])
      pivots.push({idx:i,price:prices[i],type:'trough'});
  }
  var st=prices[0]<prices[Math.min(10,n-1)]?'trough':'peak';
  pivots.unshift({idx:0,price:prices[0],type:st});
  pivots.push({idx:n-1,price:prices[n-1],type:'current'});
  var sig=[pivots[0]],k,prev,curr,move;
  for(k=1;k<pivots.length;k++){
    prev=sig[sig.length-1];curr=pivots[k];
    if(prev.type===curr.type){
      if(curr.type==='peak'&&curr.price>prev.price)sig[sig.length-1]=curr;
      else if(curr.type==='trough'&&curr.price<prev.price)sig[sig.length-1]=curr;
      continue;
    }
    move=Math.abs((curr.price-prev.price)/prev.price);
    if(move>=minMove)sig.push(curr);
  }
  return sig;
}
function validateEW(pv){
  var issues=[];
  if(pv.length>=3){var w1r=Math.abs(pv[1].price-pv[0].price);if(w1r>0){var w2r=Math.abs(pv[2].price-pv[1].price)/w1r*100;if(pv[2].price<pv[0].price)issues.push('W2>100% W1');else if(w2r<38)issues.push('W2 shallow('+w2r.toFixed(0)+'%)');}}
  if(pv.length>=4){var w1s=Math.abs(pv[1].price-pv[0].price),w3s=Math.abs(pv[3].price-pv[2].price);if(w3s<w1s)issues.push('W3<W1');}
  if(pv.length>=5&&pv[4].price<pv[1].price)issues.push('W4 overlaps W1');
  return{valid:issues.length===0,issues:issues};
}
function verifyWaves(waves,prices,vols){

  var res=[],tot=0,pass=0;
  function rsiAt(idx){return calcRSI(prices.slice(0,Math.min(idx+1,prices.length)));}
  function volAt(idx){if(!vols||!vols.length)return 0;var s=Math.max(0,idx-3),e=Math.min(vols.length-1,idx+3),sum=0,n=0;for(var j=s;j<=e;j++){sum+=vols[j]||0;n++;}return n?sum/n:0;}
  if(waves.length>=3){var w1r=Math.abs(waves[1].price-waves[0].price),w2r=w1r>0?Math.abs(waves[2].price-waves[1].price)/w1r*100:0,ok=w2r>=38&&w2r<=78.6;tot++;if(ok)pass++;res.push({wave:'W2',check:'Fib 38-78%',ok:ok,detail:w2r.toFixed(0)+'% retrace'});}
  if(waves.length>=4){var w1s=Math.abs(waves[1].price-waves[0].price),w3s=Math.abs(waves[3].price-waves[2].price),ok2=w3s>=w1s;tot++;if(ok2)pass++;res.push({wave:'W3',check:'Ext >100%',ok:ok2,detail:(w1s>0?w3s/w1s*100:0).toFixed(0)+'% of W1'});}
  if(waves.length>=5){var w3s2=Math.abs(waves[3].price-waves[2].price),w4r2=w3s2>0?Math.abs(waves[4].price-waves[3].price)/w3s2*100:0,ok3=w4r2>=23&&w4r2<=50;tot++;if(ok3)pass++;res.push({wave:'W4',check:'Fib 23-50%',ok:ok3,detail:w4r2.toFixed(0)+'% retrace'});}
  if(waves.length>=3){var r2=rsiAt(waves[2].idx),ok4=r2<50;tot++;if(ok4)pass++;res.push({wave:'W2',check:'RSI Oversold',ok:ok4,detail:'RSI:'+r2.toFixed(0)});}
  if(waves.length>=4){var r3=rsiAt(waves[3].idx),ok5=r3>55;tot++;if(ok5)pass++;res.push({wave:'W3',check:'RSI Strong',ok:ok5,detail:'RSI:'+r3.toFixed(0)});}
  if(waves.length>=4&&vols&&vols.length){var v1=volAt(waves[1].idx),v3=volAt(waves[3].idx),ok6=v3>=v1*0.7;tot++;if(ok6)pass++;res.push({wave:'W3',check:'Vol Strong',ok:ok6,detail:ok6?'Strong':'Weak'});}
  if(waves.length>=5&&vols&&vols.length){var v3b=volAt(waves[3].idx),v4=volAt(waves[4].idx),ok7=v4<=v3b*1.2;tot++;if(ok7)pass++;res.push({wave:'W4',check:'Vol Decline',ok:ok7,detail:ok7?'Declining':'Too high'});}

function checkWaveSymmetry(waves){
  if(waves.length<5)return{valid:true,score:0,note:'Need 5 waves',details:[]};
  var details=[],score=0,total=0;
  var w1=Math.abs(waves[1].price-waves[0].price),w3=waves.length>=4?Math.abs(waves[3].price-waves[2].price):0,w5=waves.length>=6?Math.abs(waves[5].price-waves[4].price):0;
  if(w3>0&&w1>0){var r=w3/w1,ok=r>=1.0;total++;if(ok)score++;details.push({label:'W3 > W1',ok:ok,detail:(r*100).toFixed(0)+'% of W1'});}
  if(w5>0&&w3>0){var r2=w5/w3,ok2=r2<=1.2;total++;if(ok2)score++;details.push({label:'W5 ≤ W3',ok:ok2,detail:(r2*100).toFixed(0)+'% of W3'});}
  var w2s=waves.length>=3?Math.abs(waves[2].price-waves[1].price):0,w4s=waves.length>=5?Math.abs(waves[4].price-waves[3].price):0;
  if(w2s>0&&w4s>0){var ratio=Math.abs(w2s-w4s)/Math.max(w2s,w4s),ok3=ratio>=0.15;total++;if(ok3)score++;details.push({label:'W2≠W4 Size',ok:ok3,detail:(ratio*100).toFixed(0)+'% difference'});}
  if(w5>0&&w1>0&&w3>w1*1.5){var r3=w5/w1,ok4=r3>=0.5&&r3<=2.0;total++;if(ok4)score++;details.push({label:'W1≈W5',ok:ok4,detail:(r3*100).toFixed(0)+'% of W1'});}
  var p=total>0?score/total*100:50;
  return{valid:p>=60,score:p,details:details,note:p>=80?'Symmetry excellent':p>=60?'Symmetry good':'Symmetry poor'};
}
function calcCEqualsA(pivots,current){
  if(pivots.length<4)return{inZone:false,target:0,label:'Need more data'};
  for(var i=pivots.length-4;i>=0;i--){
    var p0=pivots[i],p1=pivots[i+1],p2=pivots[i+2],p3=pivots[i+3];
    if(!(p0.type==='peak'&&p1.type==='trough'&&p2.type==='peak'&&p3.type==='trough'))continue;
    var waveA=Math.abs(p0.price-p1.price);if(waveA===0)continue;
    var cStart=p2.price,caTarget=cStart-waveA,caExt=cStart-waveA*1.618;
    var caRatio=(cStart-current)/waveA*100;
    var proxCA=Math.abs(current-caTarget)/Math.abs(caTarget)*100;
    var proxExt=Math.abs(current-caExt)/Math.abs(caExt)*100;
    var aTime=p1.idx-p0.idx,cTime=p3.idx-p2.idx;
    var timeRatio=aTime>0?cTime/aTime*100:0;
    var timeEqual=timeRatio>=80&&timeRatio<=120;
    var timeNote='Time: '+timeRatio.toFixed(0)+'% of Wave A';
    if(proxCA<=5&&timeEqual)return{inZone:true,target:caTarget,ratio:caRatio,label:'C=A Price+Time ✓ ('+timeNote+')'};
    if(proxCA<=5)return{inZone:true,target:caTarget,ratio:caRatio,label:'C=A Price ✓ | '+timeNote};
    if(proxExt<=5)return{inZone:true,target:caExt,ratio:caRatio,label:'C=1.618xA ✓ | '+timeNote};
    if(caRatio>=80&&caRatio<=120)return{inZone:true,target:caTarget,ratio:caRatio,label:'Near C=A ('+caRatio.toFixed(0)+'% | '+timeNote+')'};
    return{inZone:false,target:caTarget,ratio:caRatio,label:'C=A at '+fp(caTarget)+' | '+timeNote};
  }
  return{inZone:false,target:0,ratio:0,label:'No ABC found'};
}
function calcBlueBox(waves){
  if(waves.length<3)return null;
  var w0=waves[0].price,w1=waves[1].price,w1r=Math.abs(w1-w0),dir=w1>w0?1:-1;
  var f618=w1-dir*w1r*0.618,f786=w1-dir*w1r*0.786;
  var boxTop=Math.max(f618,f786),boxBot=Math.min(f618,f786);
  var cur=waves[waves.length-1].price,inBox=cur>=boxBot&&cur<=boxTop;
  var w4Box=null;
  if(waves.length>=5){
    var w3s=waves[2].price,w3e=waves[3].price,w3r=Math.abs(w3e-w3s),d3=w3e>w3s?1:-1;
    var f4a=w3e-d3*w3r*0.382,f4b=w3e-d3*w3r*0.618;
    w4Box={top:Math.max(f4a,f4b),bottom:Math.min(f4a,f4b),inBox:cur>=Math.min(f4a,f4b)&&cur<=Math.max(f4a,f4b)};
  }
  return{w2Box:{top:boxTop,bottom:boxBot,inBox:inBox},w4Box:w4Box,inAnyBox:inBox||(w4Box&&w4Box.inBox),label:inBox?'In W2 Blue Box ✓':(w4Box&&w4Box.inBox)?'In W4 Blue Box ✓':'Outside Blue Box'};
}

function makeCanvas(id,H){
  var c=document.getElementById(id);if(!c)return null;
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  return{ctx:ctx,W:W,H:H};
}
function drawPrice(prices,highs,lows,waves,sl,tps){
  var cv=makeCanvas('priceChart',280);if(!cv)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H;
  var P={t:16,r:55,b:24,l:58},cW=W-P.l-P.r,cH=H-P.t-P.b;
  var mn=Math.min.apply(null,lows)*0.97,mx=Math.max.apply(null,highs)*1.03,rng=mx-mn||1;
  function xS(i){return P.l+(i/(prices.length-1))*cW;}
  function yS(p){return P.t+cH-((p-mn)/rng)*cH;}
  for(var i=0;i<=5;i++){var y=P.t+(i/5)*cH,pr=mx-(i/5)*rng;ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(fp(pr),P.l-3,y+3);}
  var step=Math.max(1,Math.floor(priceData.length/5));
  for(i=0;i<priceData.length;i+=step){var d=priceData[i].date;var lbl=mode==='scalp'?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});ctx.fillStyle='#334155';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(lbl,xS(i),H-4);}
  if(sl>0){var slY=yS(sl);if(slY>=P.t&&slY<=P.t+cH){ctx.strokeStyle='#ef444466';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(P.l,slY);ctx.lineTo(P.l+cW,slY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ef4444';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText('SL',P.l+cW+2,slY+3);}}
  var tpLabels=['TP1','TP2','TP3','TP4'];
  for(var t=0;t<tps.length;t++){var tpY=yS(tps[t]);if(tpY<P.t||tpY>P.t+cH)continue;ctx.strokeStyle='#22c55e44';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(P.l,tpY);ctx.lineTo(P.l+cW,tpY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#22c55e';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText(tpLabels[t],P.l+cW+2,tpY+3);}
  var gr=ctx.createLinearGradient(0,P.t,0,P.t+cH);gr.addColorStop(0,'rgba(240,180,41,0.18)');gr.addColorStop(1,'rgba(240,180,41,0.01)');
  ctx.beginPath();for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}
  ctx.lineTo(xS(prices.length-1),P.t+cH);ctx.lineTo(xS(0),P.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#f0b429';ctx.lineWidth=2;for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}ctx.stroke();
  if(waves.length>1){ctx.beginPath();ctx.strokeStyle='rgba(240,180,41,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);for(i=0;i<waves.length;i++){i===0?ctx.moveTo(xS(waves[i].idx),yS(waves[i].price)):ctx.lineTo(xS(waves[i].idx),yS(waves[i].price));}ctx.stroke();ctx.setLineDash([]);}
  for(i=0;i<waves.length;i++){var w=waves[i],x=xS(w.idx),y=yS(w.price),top=w.type==='peak',off=top?-22:22;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=w.color;ctx.fill();ctx.fillStyle=w.color;ctx.fillRect(x-17,y+off-9,34,16);ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(w.label,x,y+off+3);ctx.fillStyle=w.color;ctx.font='7px monospace';ctx.fillText(fp(w.price),x,y+off+(top?-13:19));}
}
function drawRSI(prices){
  var cv=makeCanvas('rsiChart',65);if(!cv)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  var vals=[],i;for(i=14;i<prices.length;i++)vals.push(calcRSI(prices.slice(0,i+1)));
  if(!vals.length)return;
  ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*(1-70/100));
  ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*(1-30/100),cW,cH*30/100);
  [30,50,70].forEach(function(v){var y=P.t+cH*(1-v/100);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});
  function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH*(1-v/100);}
  ctx.beginPath();ctx.strokeStyle='#f97316';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();
  var last=vals[vals.length-1];ctx.fillStyle=last<30?'#22c55e':last>70?'#ef4444':'#f97316';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('RSI '+last.toFixed(1),P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('RSI',P.l-3,P.t+8);
}
function drawMACD(hist){
  var cv=makeCanvas('macdChart',65);if(!cv||!hist||!hist.length)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  var mx=Math.max.apply(null,hist.map(Math.abs))*1.1||1,yMid=P.t+cH/2,i;
  function xS(i){return P.l+(i/(hist.length-1))*cW;}function yS(v){return yMid-(v/mx)*(cH/2);}
  ctx.strokeStyle='#334155';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,yMid);ctx.lineTo(P.l+cW,yMid);ctx.stroke();
  var bw=Math.max(1,cW/hist.length-0.5);
  for(i=0;i<hist.length;i++){var x=xS(i),y=yS(hist[i]);ctx.fillStyle=hist[i]>=0?'#22c55e66':'#ef444466';ctx.fillRect(x-bw/2,Math.min(y,yMid),bw,Math.abs(y-yMid));}
  var last=hist[hist.length-1]||0;ctx.fillStyle=last>=0?'#22c55e':'#ef4444';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('MACD',P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('MACD',P.l-3,P.t+8);
}
function drawStoch(prices){
  var cv=makeCanvas('stochChart',65);if(!cv)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  var vals=[],i,period=14;
  for(i=period;i<=prices.length;i++){var sl=prices.slice(i-period,i);var high=Math.max.apply(null,sl),low=Math.min.apply(null,sl);vals.push(high===low?50:((prices[i-1]-low)/(high-low))*100);}
  if(!vals.length)return;
  ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*0.8,cW,cH*0.2);
  ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*0.2);
  [20,50,80].forEach(function(v){var y=P.t+cH*(1-v/100);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});
  function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH*(1-v/100);}
  ctx.beginPath();ctx.strokeStyle='#a855f7';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();
  var last=vals[vals.length-1];ctx.fillStyle=last<20?'#22c55e':last>80?'#ef4444':'#a855f7';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('STOCH '+last.toFixed(0),P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('STOCH',P.l-3,P.t+8);
}
function drawSMI(vals){
  var cv=makeCanvas('smiChart',65);if(!cv||!vals||!vals.length)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b,i;
  function xS(i){return P.l+(i/(vals.length-1))*cW;}
  function yS(v){return P.t+cH/2-(v/100)*(cH/2);}
  ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*0.7,cW,cH*0.3);
  ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*0.3);
  [-40,0,40].forEach(function(v){var y=yS(v);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});
  ctx.beginPath();ctx.strokeStyle='#06b6d4';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();
  var last=vals[vals.length-1]||0;ctx.fillStyle=last<-40?'#22c55e':last>40?'#ef4444':'#06b6d4';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('SMI '+last.toFixed(0),P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('SMI',P.l-3,P.t+8);
}
function drawVol(vols){
  var cv=makeCanvas('volChart',50);if(!cv||!vols.length)return;
  var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  var maxV=Math.max.apply(null,vols)||1,bw=Math.max(1,cW/vols.length-0.5),i;
  for(i=0;i<vols.length;i++){var x=P.l+(i/(vols.length-1))*cW,hh=(vols[i]/maxV)*cH,up=i>0&&priceData[i]&&priceData[i-1]&&priceData[i].price>=priceData[i-1].price;ctx.fillStyle=up?'#22c55e44':'#ef444444';ctx.fillRect(x-bw/2,P.t+cH-hh,bw,hh);}
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('VOL',P.l-3,P.t+8);
}
