// ── INDICATORS ─────────────────────────────────────────────────
function calcRSI(prices){
  var period=14;
  if(prices.length<period+1)return 50;
  var ag=0,al=0,i,d;
  for(i=1;i<=period;i++){d=prices[i]-prices[i-1];if(d>0)ag+=d;else al+=Math.abs(d);}
  ag/=period;al/=period;
  for(i=period;i<prices.length;i++){d=prices[i]-prices[i-1];ag=(ag*13+(d>0?d:0))/14;al=(al*13+(d<0?Math.abs(d):0))/14;}
  return al===0?100:100-(100/(1+ag/al));
}
function calcEMA(prices,period){
  if(prices.length<period)return[];
  var k=2/(period+1),sum=0,i;
  for(i=0;i<period;i++)sum+=prices[i];
  var r=[sum/period];
  for(i=period;i<prices.length;i++)r.push(prices[i]*k+r[r.length-1]*(1-k));
  return r;
}
function calcMACD(prices){
  if(prices.length<35)return{cross:false,turning:false,hist:0,histLine:[]};
  var ef=calcEMA(prices,12),es=calcEMA(prices,26),ml=[],i;
  for(i=0;i<es.length;i++)ml.push(ef[i+14]-es[i]);
  if(ml.length<9)return{cross:false,turning:false,hist:0,histLine:[]};
  var sl=calcEMA(ml,9),diff=ml.length-sl.length,hist=[];
  for(i=0;i<sl.length;i++)hist.push(ml[i+diff]-sl[i]);
  var h=hist[hist.length-1]||0,ph=hist[hist.length-2]||0;
  return{cross:h>0&&ph<=0,turning:h>ph,hist:h,prev:ph,histLine:hist};
}
function calcStoch(prices,period){
  period=period||14;if(prices.length<period)return 50;
  var sl=prices.slice(-period),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl);
  if(high===low)return 50;
  return((prices[prices.length-1]-low)/(high-low))*100;
}
function calcEWO(prices){
  if(prices.length<35)return 0;
  var m5=0,m35=0,i;
  for(i=prices.length-5;i<prices.length;i++)m5+=prices[i];
  for(i=prices.length-35;i<prices.length;i++)m35+=prices[i];
  return m5/5-m35/35;
}

// ── WAVE DETECTION ─────────────────────────────────────────────
function findPivots(prices,minMove){
  minMove=minMove||0.10;
  var n=prices.length,win=Math.max(3,Math.floor(n/20)),pivots=[],i,sl,mx,mn;
  for(i=win;i<n-win;i++){
    sl=prices.slice(i-win,i+win+1);mx=Math.max.apply(null,sl);mn=Math.min.apply(null,sl);
    if(prices[i]===mx&&prices[i]>prices[i-1]&&prices[i]>prices[i+1])pivots.push({idx:i,price:prices[i],type:'peak'});
    else if(prices[i]===mn&&prices[i]<prices[i-1]&&prices[i]<prices[i+1])pivots.push({idx:i,price:prices[i],type:'trough'});
  }
  var st=prices[0]<prices[Math.min(10,n-1)]?'trough':'peak';
  pivots.unshift({idx:0,price:prices[0],type:st});
  pivots.push({idx:n-1,price:prices[n-1],type:'current'});
  var sig=[pivots[0]],k,prev,curr,move;
  for(k=1;k<pivots.length;k++){
    prev=sig[sig.length-1];curr=pivots[k];
    if(prev.type===curr.type){
      if(curr.type==='peak'&&curr.price>prev.price)sig[sig.length-1]=curr;
      else if(curr.type==='trough'&&curr.price<prev.price)sig[sig.length-1]=curr;
      continue;
    }
    move=Math.abs((curr.price-prev.price)/prev.price);
    if(move>=minMove)sig.push(curr);
  }
  return sig;
}
function validateEW(pv){
  var issues=[];
  if(pv.length>=3){var w1r=Math.abs(pv[1].price-pv[0].price);if(w1r>0){var w2r=Math.abs(pv[2].price-pv[1].price)/w1r*100;if(pv[2].price<pv[0].price)issues.push('W2>100% W1');else if(w2r<38)issues.push('W2 shallow('+w2r.toFixed(0)+'%)');}}
  if(pv.length>=4){var w1s=Math.abs(pv[1].price-pv[0].price),w3s=Math.abs(pv[3].price-pv[2].price);if(w3s<w1s)issues.push('W3<W1');}
  if(pv.length>=5&&pv[4].price<pv[1].price)issues.push('W4 overlaps W1');
  return{valid:issues.length===0,issues:issues};
}

  if(prices&&pv.length>=4){var wc=detectWaveCBottom(pv,prices,rsiVal||50);if(wc.detected)return'Wave C';}

}
function checkAlternation(pv){

  var w1=Math.abs(pv[1].price-pv[0].price),w3=Math.abs(pv[3].price-pv[2].price);
  if(!w1||!w3)return{valid:true,note:'Cannot calc'};
  var w2r=Math.abs(pv[2].price-pv[1].price)/w1*100,w4r=Math.abs(pv[4].price-pv[3].price)/w3*100;
  var alt=(w2r>50&&w4r<40)||(w2r<40&&w4r>40)||Math.abs(w2r-w4r)>15;
  return{valid:alt,note:alt?'Alternation ✓':'Similar depth',w2r:w2r,w4r:w4r};
}
function detectCandlestick(prices){
  if(prices.length<3)return{pattern:'None',bullish:false};
  var p1=prices[prices.length-1],p2=prices[prices.length-2],p3=prices[prices.length-3];
  if(p2<p3&&p1>p2&&(p1-p2)>(p3-p2)*0.5)return{pattern:'Bullish Engulfing',bullish:true};
  if(p2<p3*0.97&&p1>p2*1.02)return{pattern:'Hammer',bullish:true};
  if(p3>p2&&p2<p1&&p1>(p3+p2)/2)return{pattern:'Morning Star',bullish:true};
  if(Math.abs(p1-p2)/p2<0.005&&p2<p3*0.98)return{pattern:'Doji Reversal',bullish:true};
  if(p1<p2&&p2<p3)return{pattern:'Downtrend',bullish:false};
  return{pattern:'No pattern',bullish:false};
}
function checkWaveSymmetry(waves){
  if(waves.length<5)return{valid:true,score:0,note:'Need 5 waves',details:[]};
  var details=[],score=0,total=0;
  var w1=Math.abs(waves[1].price-waves[0].price),w3=waves.length>=4?Math.abs(waves[3].price-waves[2].price):0,w5=waves.length>=6?Math.abs(waves[5].price-waves[4].price):0;
  if(w3>0&&w1>0){var r=w3/w1,ok=r>=1.0;total++;if(ok)score++;details.push({label:'W3 > W1',ok:ok,detail:(r*100).toFixed(0)+'% of W1'});}
  if(w5>0&&w3>0){var r2=w5/w3,ok2=r2<=1.2;total++;if(ok2)score++;details.push({label:'W5 ≤ W3',ok:ok2,detail:(r2*100).toFixed(0)+'% of W3'});}
  var w2s=waves.length>=3?Math.abs(waves[2].price-waves[1].price):0,w4s=waves.length>=5?Math.abs(waves[4].price-waves[3].price):0;
  if(w2s>0&&w4s>0){var ratio=Math.abs(w2s-w4s)/Math.max(w2s,w4s),ok3=ratio>=0.15;total++;if(ok3)score++;details.push({label:'W2≠W4 Size',ok:ok3,detail:(ratio*100).toFixed(0)+'% diff'});}
  if(w5>0&&w1>0&&w3>w1*1.5){var r3=w5/w1,ok4=r3>=0.5&&r3<=2.0;total++;if(ok4)score++;details.push({label:'W1≈W5',ok:ok4,detail:(r3*100).toFixed(0)+'% of W1'});}
  var pct=total>0?score/total*100:50;
  return{valid:pct>=60,score:pct,details:details,note:pct>=80?'Symmetry excellent':pct>=60?'Symmetry good':'Symmetry poor'};
}
function calcBlueBox(waves){
  if(waves.length<3)return null;
  var w0=waves[0].price,w1=waves[1].price,w1r=Math.abs(w1-w0),dir=w1>w0?1:-1;
  var f618=w1-dir*w1r*0.618,f786=w1-dir*w1r*0.786;
  var boxTop=Math.max(f618,f786),boxBot=Math.min(f618,f786);
  var cur=waves[waves.length-1].price,inBox=cur>=boxBot&&cur<=boxTop;
  var w4Box=null;
  if(waves.length>=5){var w3s=waves[2].price,w3e=waves[3].price,w3r=Math.abs(w3e-w3s),d3=w3e>w3s?1:-1;var f382=w3e-d3*w3r*0.382,f618b=w3e-d3*w3r*0.618;w4Box={top:Math.max(f382,f618b),bottom:Math.min(f382,f618b),inBox:cur>=Math.min(f382,f618b)&&cur<=Math.max(f382,f618b)};}
  return{w2Box:{top:boxTop,bottom:boxBot,inBox:inBox},w4Box:w4Box,inAnyBox:inBox||(w4Box&&w4Box.inBox),label:inBox?'In W2 Blue Box ✓':(w4Box&&w4Box.inBox)?'In W4 Blue Box ✓':'Outside Blue Box'};
}
function calcSMI(prices,period){
  period=period||14;if(prices.length<period)return 0;
  var result=[],i;
  for(i=period-1;i<prices.length;i++){var sl=prices.slice(i-period+1,i+1),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl),mid=(high+low)/2,range=high-low;result.push(range>0?((prices[i]-mid)/(range/2))*100:0);}
  var smoothed=calcEMA(result,3);return smoothed.length>0?smoothed[smoothed.length-1]:0;
}
function calcSMIFull(prices,period){
  period=period||14;var result=[],i;
  for(i=period-1;i<prices.length;i++){var sl=prices.slice(i-period+1,i+1),high=Math.max.apply(null,sl),low=Math.min.apply(null,sl),mid=(high+low)/2,range=high-low;result.push(range>0?((prices[i]-mid)/(range/2))*100:0);}
  return calcEMA(result,3);
}
function detectTruncatedW5(waves,prices){
  if(waves.length<6)return{detected:false,note:'Need W5 data'};
  var w3h=waves[3].price,w5h=waves[5]?waves[5].price:waves[waves.length-1].price;
  var truncated=w5h<w3h&&w5h>waves[4].price;
  var r3=calcRSI(prices.slice(0,Math.min(waves[3].idx+1,prices.length)));
  var r5=calcRSI(prices.slice(0,Math.min((waves[5]?waves[5].idx:prices.length-1)+1,prices.length)));
  var strong=truncated&&r5<r3;
  return{detected:truncated,strong:strong,note:strong?'⚠️ Truncated W5 — Major reversal imminent':truncated?'Possible truncated W5':'No truncation',w3_price:w3h,w5_price:w5h};
}
function calcFibRetrace(pivots){
  if(pivots.length<3)return{retrace:0,valid:false,label:'No data'};
  var w1Range=Math.abs(pivots[1].price-pivots[0].price);if(w1Range===0)return{retrace:0,valid:false,label:'Invalid W1'};
  var w2Range=Math.abs(pivots[2].price-pivots[1].price),retrace=(w2Range/w1Range)*100,valid=retrace>=38.2&&retrace<=100,label='';
  if(retrace<38.2)label='Shallow (<38.2%)';else if(retrace<=50.0)label='0.382 Fib Zone';else if(retrace<=61.8)label='0.500 Fib Zone';else if(retrace<=78.6)label='0.618 Golden Ratio ✓';else if(retrace<=100)label='0.786 Deep Fib';else label='W2 > W1 (Invalid)';
  return{retrace:retrace,valid:valid,label:label,golden:retrace>=38.2&&retrace<=78.6};
}

function detectWaveCBottom(pivots,prices,rsiVal){

function verifyWaves(waves,prices,vols){

  function volAt(idx){if(!vols||!vols.length)return 0;var s=Math.max(0,idx-3),e=Math.min(vols.length-1,idx+3),sum=0,n=0;for(var j=s;j<=e;j++){sum+=vols[j]||0;n++;}return n?sum/n:0;}
  if(waves.length>=3){var w1r=Math.abs(waves[1].price-waves[0].price),w2r=w1r>0?Math.abs(waves[2].price-waves[1].price)/w1r*100:0,ok=w2r>=38&&w2r<=78.6;tot++;if(ok)pass++;res.push({wave:'W2',check:'Fib 38-78%',ok:ok,detail:w2r.toFixed(0)+'% retrace'});}
  if(waves.length>=4){var w1s=Math.abs(waves[1].price-waves[0].price),w3s=Math.abs(waves[3].price-waves[2].price),ok2=w3s>=w1s;tot++;if(ok2)pass++;res.push({wave:'W3',check:'Ext >100%',ok:ok2,detail:(w1s>0?w3s/w1s*100:0).toFixed(0)+'% of W1'});}
  if(waves.length>=5){var w3s2=Math.abs(waves[3].price-waves[2].price),w4r2=w3s2>0?Math.abs(waves[4].price-waves[3].price)/w3s2*100:0,ok3=w4r2>=23&&w4r2<=50;tot++;if(ok3)pass++;res.push({wave:'W4',check:'Fib 23-50%',ok:ok3,detail:w4r2.toFixed(0)+'% retrace'});}
  if(waves.length>=3){var r2=rsiAt(waves[2].idx),ok4=r2<50;tot++;if(ok4)pass++;res.push({wave:'W2',check:'RSI Oversold',ok:ok4,detail:'RSI:'+r2.toFixed(0)});}
  if(waves.length>=4){var r3=rsiAt(waves[3].idx),ok5=r3>55;tot++;if(ok5)pass++;res.push({wave:'W3',check:'RSI Strong',ok:ok5,detail:'RSI:'+r3.toFixed(0)});}

// CHART STRUCTURE RECOGNIZER — NEW ADDITION
// Reads the chart, identifies which pattern exists, adapts
// the situational checks accordingly.
// Priority: WXYXZ → Expanded Flat → Running Correction →
//           ABC Zigzag → EW W4 → EW W2 → Unknown
// ══════════════════════════════════════════════════════════════
function readMarketPhase(prices, pivots, current, pctATH) {
  if (prices.length < 50) return 'UNKNOWN';
  var ma20=0,ma50=0,i;
  for(i=prices.length-20;i<prices.length;i++) ma20+=prices[i]; ma20/=20;
  for(i=prices.length-50;i<prices.length;i++) ma50+=prices[i]; ma50/=50;
  var peaks=[],troughs=[];
  for(i=0;i<pivots.length;i++){
    if(pivots[i].type==='peak') peaks.push(pivots[i]);
    else if(pivots[i].type==='trough') troughs.push(pivots[i]);
  }
  var hh=peaks.length>=2 && peaks[peaks.length-1].price>peaks[peaks.length-2].price;
  var hl=troughs.length>=2 && troughs[troughs.length-1].price>troughs[troughs.length-2].price;
  var lh=peaks.length>=2 && peaks[peaks.length-1].price<peaks[peaks.length-2].price;
  var ll=troughs.length>=2 && troughs[troughs.length-1].price<troughs[troughs.length-2].price;
  var inCorrection=pctATH<-20;
  var momentum=prices.length>=10?(prices[prices.length-1]-prices[prices.length-10])/prices[prices.length-10]*100:0;
  if(lh&&ll&&current<ma50) return 'DOWNTREND';
  if(hh&&hl&&current>ma50&&current>ma20) return 'IMPULSING';
  if(inCorrection&&(hh||hl)) return 'CORRECTING';
  if(inCorrection) return 'CORRECTING';
  if(current>ma50&&momentum>5) return 'TRENDING_UP';
  if(current<ma50&&momentum<-5) return 'TRENDING_DOWN';
  return 'NEUTRAL';
}

function scoreStructure(struct, rsiVal, macdBull, volDec, volExp, stoch) {
  if(!struct||struct.type==='UNKNOWN') return 0;
  var t=struct.type, score=0;
  // Structure Quality (40 pts)
  var sq=0;
  if(t==='WXYXZ') sq+=18;
  else if(t==='EXPANDED_FLAT'||t==='RUNNING_CORRECTION') sq+=14;
  else if(t==='ABC_ZIGZAG'||t==='EW_W4'||t==='EW_W2') sq+=10;
  else if(t==='DOUBLE_BOTTOM'||t==='FALLING_WEDGE') sq+=8;
  if(t==='ABC_ZIGZAG'){
    var cp=struct.cProgress||0;
    sq+=(cp>=90?10:cp>=70?6:cp>=50?3:0);
  } else if(t==='EW_W4'){
    var w4r=struct.w4Ret||0;
    sq+=(w4r>=0.23&&w4r<=0.38?10:w4r<=0.50?6:2);
  } else if(t==='EW_W2'){
    var w2r=struct.w2Ret||0;
    sq+=(w2r>=0.50&&w2r<=0.786?10:w2r>=0.382?6:2);
  } else { sq+=10; }
  sq+=10; // no overlap (validated in detector)
  score+=Math.min(sq,40);
  // EW Rules (25 pts)
  var ew=0;
  if(t==='EW_W4'||t==='EW_W2'){
    var w2ret=struct.w2Ret||0;
    if(w2ret<=1.0) ew+=8;
    if((struct.w3||0)>=(struct.w1||0)) ew+=8;
    ew+=9;
  } else { ew+=25; }
  score+=Math.min(ew,25);
  // Fibonacci (15 pts)
  var fib=0;
  if(t==='EW_W2'){var r=struct.w2Ret||0;fib=(r>=0.618&&r<=0.786?15:r>=0.5?10:r>=0.382?7:0);}
  else if(t==='EW_W4'){var r=struct.w4Ret||0;fib=(r>=0.236&&r<=0.382?15:r<=0.5?10:5);}
  else if(t==='ABC_ZIGZAG'){fib=struct.cConfirmed?15:8;}
  else{fib=10;}
  score+=Math.min(fib,15);
  // Volume (10 pts)
  var vol=0;
  if(volDec) vol+=5; if(volExp) vol+=5;
  score+=Math.min(vol,10);
  // Momentum (10 pts)
  var mom=0;
  if(rsiVal<35) mom+=5; else if(rsiVal<45) mom+=3;
  if(macdBull) mom+=5; else if(stoch<20) mom+=3;
  score+=Math.min(mom,10);
  return Math.min(score,100);
}

function detectClassicalPatterns(prices, pivots, current) {
  if(prices.length<30||pivots.length<4) return null;
  var peaks=[],troughs=[],i;
  for(i=0;i<pivots.length;i++){
    if(pivots[i].type==='peak') peaks.push(pivots[i]);
    else if(pivots[i].type==='trough') troughs.push(pivots[i]);
  }
  // Double Bottom
  if(troughs.length>=2){
    var t1=troughs[troughs.length-2].price,t2=troughs[troughs.length-1].price;
    if(Math.abs(t1-t2)/t1<0.03){
      var midPeaks=peaks.filter(function(p){return p.idx>troughs[troughs.length-2].idx&&p.idx<troughs[troughs.length-1].idx;});
      if(midPeaks.length>0){
        var neckline=midPeaks[midPeaks.length-1].price;
        if(current>=t2*0.97){
          return{type:'DOUBLE_BOTTOM',label:'Double Bottom',color:'#22c55e',
            entryWave:'Double Bottom',entryPrice:t2,neckline:neckline,
            target:neckline+(neckline-t2),confidence:70,
            sitApply:['rsi_ok','macd_ok','vol_exp','candlestick'],
            sitNA:['fib_golden','blue_box','alternation','wave_symmetry','wxyxz','abc_struct']};
        }
      }
    }
  }
  // Double Top — block longs
  if(peaks.length>=2){
    var p1=peaks[peaks.length-2].price,p2=peaks[peaks.length-1].price;
    if(Math.abs(p1-p2)/p1<0.03)
      return{type:'DOUBLE_TOP',label:'Double Top',confidence:0,sitApply:[],sitNA:[]};
  }
  // Falling Wedge
  if(peaks.length>=3&&troughs.length>=3){
    var ph=[peaks[peaks.length-3].price,peaks[peaks.length-2].price,peaks[peaks.length-1].price];
    var tl=[troughs[troughs.length-3].price,troughs[troughs.length-2].price,troughs[troughs.length-1].price];
    var hf=ph[0]>ph[1]&&ph[1]>ph[2];
    var lf=tl[0]>tl[1]&&tl[1]>tl[2];
    var conv=(ph[ph.length-1]-tl[tl.length-1])<(ph[0]-tl[0])*0.7;
    if(hf&&lf&&conv)
      return{type:'FALLING_WEDGE',label:'Falling Wedge (Bullish)',color:'#a855f7',
        entryWave:'Wedge Bottom',entryPrice:current,target:ph[0],confidence:65,
        sitApply:['rsi_ok','macd_ok','vol_exp'],
        sitNA:['fib_golden','blue_box','wxyxz','abc_struct','alternation']};
  }
  return null;
}

function recognizeChartStructure(pivots, prices, current, pctATH, rsiVal, macdBull, volDec, volExp, stoch) {
  if(!pctATH) pctATH=prices.length>0?((current-Math.max.apply(null,prices))/Math.max.apply(null,prices)*100):0;
  if(!rsiVal) rsiVal=50; if(!stoch) stoch=50;

    return{type:'DOWNTREND',label:'Downtrend — No Long Signal',confidenceScore:0,phase:phase,sitApply:[],sitNA:[]};

      sitApply:['wxyxz','ca_zone','rsi_ok','stoch_ok','macd_ok','vol_exp','candlestick'],
      sitNA:['fib_golden','alternation','wave_symmetry','blue_box','abc_struct','wave_c_bottom']});
  }

    var p=pivots.slice(i,i+6);

    var w3=w3h-w2l,w5=w5h-w4l;
    if(w3<=0||(w3<w1&&w3<w5)||w4l<=w1h||w5h<=w3h) continue;
    w5Top=w5h;
    var post=pivots.filter(function(pv){return pv.idx>p[5].idx;});

    if(aP){
      waBot=aP.price; waRange=w5h-waBot; if(waRange<=0) break;
      var postA=post.filter(function(pv){return pv.idx>aP.idx;});
      var bP=null; for(var j=0;j<postA.length;j++){if(postA[j].type==='peak'){bP=postA[j];break;}}
      if(bP){
        wbTop=bP.price; wbRet=waRange>0?(wbTop-waBot)/waRange:0;
        var postB=post.filter(function(pv){return pv.idx>bP.idx;});
        var cP=null; for(var j=0;j<postB.length;j++){if(postB[j].type==='trough'){cP=postB[j];break;}}
        wcBot=cP?cP.price:current;
        var wcRange=wbTop-wcBot,cVsA=waRange>0?wcRange/waRange:0;
        // Expanded Flat
        if(wbTop>w5Top&&cVsA>=0.6){
          var cProg=Math.min(cVsA/1.236*100,100);
          tryAdd({type:'EXPANDED_FLAT',label:'Expanded Flat Correction',
            color:'#f97316',entryWave:'Wave C',entryPrice:wcBot,
            waBot:waBot,wbTop:wbTop,wcBot:wcBot,w5Top:w5Top,waRange:waRange,
            wbRetPct:(wbRet*100).toFixed(0),cProgress:cProg,
            cT1236:wbTop-waRange*1.236,cT1618:wbTop-waRange*1.618,
            sitApply:['wave_c_bottom','ca_zone','abc_struct','rsi_ok','stoch_ok','macd_ok','vol_dec','vol_exp'],

          tryAdd({type:'RUNNING_CORRECTION',label:'Running Correction (Bullish)',
            color:'#a855f7',entryWave:'Wave C (Higher Low)',entryPrice:wcBot,
            waBot:waBot,wbTop:wbTop,wcBot:wcBot,w5Top:w5Top,waRange:waRange,
            wbRetPct:(wbRet*100).toFixed(0),cVsAPct:(cVsA*100).toFixed(0),
            sitApply:['wave_c_bottom','abc_struct','wave_count','rsi_ok','stoch_ok','macd_ok','vol_dec','vol_exp'],
            sitNA:['fib_golden','blue_box','ca_zone','alternation','wxyxz']});
        }
        // ABC Zigzag
        if(wbRet>=0.38&&wbRet<=0.78){
          var cProg2=cVsA*100,cEqA=wbTop-waRange;
          var cConf=Math.abs(wcBot-cEqA)/Math.max(Math.abs(cEqA),0.0001)<0.05;
          if(cProg2>=60){
            tryAdd({type:'ABC_ZIGZAG',label:'ABC Zigzag Correction',
              color:'#3b82f6',entryWave:'Wave C',entryPrice:wcBot,
              waBot:waBot,wbTop:wbTop,wcBot:wcBot,w5Top:w5Top,waRange:waRange,
              wbRetPct:(wbRet*100).toFixed(0),cProgress:cProg2,
              cEqATgt:cEqA,cConfirmed:cConf,
              sitApply:['wave_c_bottom','ca_zone','abc_struct','rsi_ok','stoch_ok','macd_ok','vol_dec','vol_exp'],
              sitNA:['fib_golden','blue_box','alternation','wave_symmetry','wxyxz']});
          }
        }
      }
    }
    break;
  }

  // EW W4
  for(var i=n-5;i>=0;i--){
    if(i+4>=n) continue;
    var p=pivots.slice(i,i+5);
    var types=p.map(function(x){return x.type;}).join(',');
    if(types!=='trough,peak,trough,peak,trough') continue;
    var w0=p[0].price,w1h=p[1].price,w2l=p[2].price,w3h=p[3].price,w4l=p[4].price;
    var w1=w1h-w0,w3=w3h-w2l;
    if(w1<=0||w3<=0||w2l<=w0||w3<w1||w4l<=w1h) continue;
    if(Math.abs(current-w4l)/w4l>0.08) continue;
    var w2Ret=(w1h-w2l)/w1,w4Ret=(w3h-w4l)/w3;

    tryAdd({type:'EW_W4',label:'Standard EW - W4 Entry',

      w1h:w1h,w2l:w2l,w3h:w3h,w4l:w4l,w1:w1,w3:w3,
      w2Ret:w2Ret,w4Ret:w4Ret,fibLabel:fibLbl,inBlueBox:inBB,
      sitApply:['fib_golden','blue_box','alternation','wave_symmetry','wave_count',
                'rsi_ok','stoch_ok','macd_ok','vol_dec','vol_exp','smi_ok','candlestick'],
      sitNA:['wave_c_bottom','ca_zone','abc_struct','wxyxz']});
    break;
  }

  // EW W2
  for(var i=n-6;i>=0;i--){
    if(i+5>=n) continue;
    var p=pivots.slice(i,i+6);
    var types=p.map(function(x){return x.type;}).join(',');
    if(types!=='trough,peak,trough,peak,trough,peak') continue;
    var w0=p[0].price,w1h=p[1].price,w2l=p[2].price,w3h=p[3].price,w4l=p[4].price,w5h=p[5].price;
    var w1=w1h-w0; if(w1<=0||w2l<=w0) continue;
    if(Math.abs(current-w2l)/w2l>0.08) continue;
    var w2Ret=(w1h-w2l)/w1;
    var fibLbl=calcFibRetrace(p.slice(0,3)).label;
    tryAdd({type:'EW_W2',label:'Standard EW - W2 Entry',
      color:'#22c55e',entryWave:'W2',entryPrice:w2l,
      w1h:w1h,w2l:w2l,w3h:w3h,w4l:w4l,w5h:w5h,w1:w1,w2Ret:w2Ret,fibLabel:fibLbl,
      sitApply:['fib_golden','wave_symmetry','wave_count','rsi_ok','stoch_ok',
                'macd_ok','vol_dec','vol_exp','candlestick'],
      sitNA:['blue_box','alternation','wave_c_bottom','ca_zone','abc_struct','wxyxz']});
    break;
  }

  // Add classical if found
  if(classical&&classical.type!=='DOUBLE_TOP'){
    classical.confidenceScore=classical.confidence||0;
    classical.phase=phase;
    candidates.push(classical);
  }

  // Pick highest scoring
  if(candidates.length===0)
    return{type:'UNKNOWN',label:'No valid structure found',confidenceScore:0,phase:phase,sitApply:[],sitNA:[]};

  candidates.sort(function(a,b){return (b.confidenceScore||0)-(a.confidenceScore||0);});
  var winner=candidates[0];
  var runner=candidates.length>1?candidates[1]:null;

  // Ambiguity check
  if(runner){
    var gap=(winner.confidenceScore||0)-(runner.confidenceScore||0);
    if(gap<5){
      winner.confidenceScore=Math.floor((winner.confidenceScore||0)*0.85);
      winner.ambiguous=true;
      winner.alternate=runner.label||'';
    }
  }
  if(runner&&!winner.alternate) winner.alternate=runner.label||'';
  winner.phase=phase;
  winner.allCandidates=candidates.map(function(c){return{type:c.type,score:c.confidenceScore||0};});
  return winner;
}

function makeCanvas(id,H){var c=document.getElementById(id);if(!c)return null;var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth;c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);return{ctx:ctx,W:W,H:H};}
function drawPrice(prices,highs,lows,waves,sl,tps){var cv=makeCanvas('priceChart',280);if(!cv)return;var ctx=cv.ctx,W=cv.W,H=cv.H;var P={t:16,r:55,b:24,l:58},cW=W-P.l-P.r,cH=H-P.t-P.b;var mn=Math.min.apply(null,lows)*0.97,mx=Math.max.apply(null,highs)*1.03,rng=mx-mn||1;function xS(i){return P.l+(i/(prices.length-1))*cW;}function yS(p){return P.t+cH-((p-mn)/rng)*cH;}for(var i=0;i<=5;i++){var y=P.t+(i/5)*cH,pr=mx-(i/5)*rng;ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(fp(pr),P.l-3,y+3);}var step=Math.max(1,Math.floor(priceData.length/5));for(i=0;i<priceData.length;i+=step){var d=priceData[i].date;var lbl=mode==='scalp'?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});ctx.fillStyle='#334155';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(lbl,xS(i),H-4);}var slY=yS(sl);if(slY>=P.t&&slY<=P.t+cH){ctx.strokeStyle='#ef444466';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(P.l,slY);ctx.lineTo(P.l+cW,slY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ef4444';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText('SL',P.l+cW+2,slY+3);}var tpLabels=['TP1','TP2','TP3','TP4'];for(var t=0;t<tps.length;t++){var tpY=yS(tps[t]);if(tpY<P.t||tpY>P.t+cH)continue;ctx.strokeStyle='#22c55e44';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(P.l,tpY);ctx.lineTo(P.l+cW,tpY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#22c55e';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText(tpLabels[t],P.l+cW+2,tpY+3);}var gr=ctx.createLinearGradient(0,P.t,0,P.t+cH);gr.addColorStop(0,'rgba(240,180,41,0.18)');gr.addColorStop(1,'rgba(240,180,41,0.01)');ctx.beginPath();for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}ctx.lineTo(xS(prices.length-1),P.t+cH);ctx.lineTo(xS(0),P.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();ctx.beginPath();ctx.strokeStyle='#f0b429';ctx.lineWidth=2;for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}ctx.stroke();if(waves.length>1){ctx.beginPath();ctx.strokeStyle='rgba(240,180,41,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);for(i=0;i<waves.length;i++){i===0?ctx.moveTo(xS(waves[i].idx),yS(waves[i].price)):ctx.lineTo(xS(waves[i].idx),yS(waves[i].price));}ctx.stroke();ctx.setLineDash([]);}for(i=0;i<waves.length;i++){var w=waves[i],x=xS(w.idx),y=yS(w.price),top=w.type==='peak',off=top?-22:22;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=w.color;ctx.fill();ctx.fillStyle=w.color;ctx.fillRect(x-17,y+off-9,34,16);ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(w.label,x,y+off+3);ctx.fillStyle=w.color;ctx.font='7px monospace';ctx.fillText(fp(w.price),x,y+off+(top?-13:19));}}
function drawRSI(prices){var cv=makeCanvas('rsiChart',65);if(!cv)return;var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;var vals=[],i;for(i=14;i<prices.length;i++)vals.push(calcRSI(prices.slice(0,i+1)));if(!vals.length)return;ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*(1-70/100));ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*(1-30/100),cW,cH*30/100);[30,50,70].forEach(function(v){var y=P.t+cH*(1-v/100);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH*(1-v/100);}ctx.beginPath();ctx.strokeStyle='#f97316';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();var last=vals[vals.length-1];ctx.fillStyle=last<30?'#22c55e':last>70?'#ef4444':'#f97316';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('RSI '+last.toFixed(1),P.l+cW+2,P.t+cH/2+3);ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('RSI',P.l-3,P.t+8);}
function drawMACD(hist){var cv=makeCanvas('macdChart',65);if(!cv||!hist||!hist.length)return;var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;var mx=Math.max.apply(null,hist.map(Math.abs))*1.1||1,yMid=P.t+cH/2,i;function xS(i){return P.l+(i/(hist.length-1))*cW;}function yS(v){return yMid-(v/mx)*(cH/2);}ctx.strokeStyle='#334155';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,yMid);ctx.lineTo(P.l+cW,yMid);ctx.stroke();var bw=Math.max(1,cW/hist.length-0.5);for(i=0;i<hist.length;i++){var x=xS(i),y=yS(hist[i]);ctx.fillStyle=hist[i]>=0?'#22c55e66':'#ef444466';ctx.fillRect(x-bw/2,Math.min(y,yMid),bw,Math.abs(y-yMid));}var last=hist[hist.length-1]||0;ctx.fillStyle=last>=0?'#22c55e':'#ef4444';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('MACD',P.l+cW+2,P.t+cH/2+3);ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('MACD',P.l-3,P.t+8);}
function drawStoch(prices){var cv=makeCanvas('stochChart',65);if(!cv)return;var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;var vals=[],i,period=14;for(i=period;i<=prices.length;i++){var sl=prices.slice(i-period,i);var high=Math.max.apply(null,sl),low=Math.min.apply(null,sl);vals.push(high===low?50:((prices[i-1]-low)/(high-low))*100);}if(!vals.length)return;ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*0.8,cW,cH*0.2);ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*0.2);[20,50,80].forEach(function(v){var y=P.t+cH*(1-v/100);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH*(1-v/100);}ctx.beginPath();ctx.strokeStyle='#a855f7';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();var last=vals[vals.length-1];ctx.fillStyle=last<20?'#22c55e':last>80?'#ef4444':'#a855f7';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('STOCH '+last.toFixed(0),P.l+cW+2,P.t+cH/2+3);ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('STOCH',P.l-3,P.t+8);}
function drawSMI(vals){var cv=makeCanvas('smiChart',65);if(!cv||!vals||!vals.length)return;var ctx=cv.ctx,W=cv.W,H=cv.H,P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b,i;function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH/2-(v/100)*(cH/2);}ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*0.7,cW,cH*0.3);ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*0.3);[-40,0,40].forEach(function(v){var y=yS(v);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});ctx.beginPath();ctx.strokeStyle='#06b6d4';ctx.lineWidth=1.5;for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();var last=vals[vals.length-1]||0;ctx.fillStyle=last<-40?'#22c55e':last>40?'#ef4444':'#06b6d4';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('SMI '+last.toFixed(0),P.l+cW+2,P.t+cH/2+3);ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('SMI',P.l-3,P.t+8);}
