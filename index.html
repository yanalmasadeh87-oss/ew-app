<script>
var KEY = 'CG-DJnA8sWPRSUuF8Xz27Fhastn';
var CG = 'https://api.coingecko.com/api/v3';

var coinId = '';
var days = 'max';
var mode = 'swing';
var priceData = [];
var volData = [];
var dailyPrices = [];
var weeklyPrices = [];
var coinInfo = {};

function show(h) {
  document.getElementById('main').innerHTML = h;
}

function fp(p) {
  if (!p && p !== 0) return 'N/A';
  if (p >= 1000) return '$' + Math.round(p).toLocaleString();
  if (p >= 1) return '$' + p.toFixed(4);
  if (p >= 0.01) return '$' + p.toFixed(5);
  return '$' + p.toFixed(7);
}

function fpc(p) {
  return (p >= 0 ? '+' : '') + p.toFixed(1) + '%';
}

function loadCoin(id, sym) {
  document.getElementById('inp').value = sym;
  coinId = id;
  fetchData(id);
}

function doSearch() {
  var v = document.getElementById('inp').value.trim();
  if (!v) return;
  show('<div class="info">Searching...</div>');
  fetch(CG + '/search?query=' + encodeURIComponent(v), {headers:{'x-cg-demo-api-key':KEY}})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.coins || !d.coins.length) {
        show('<div class="err">Not found. Try "bitcoin" or "ripple"</div>');
        return;
      }
      coinId = d.coins[0].id;
      fetchData(coinId);
    })
    .catch(function(e) { show('<div class="err">Error: ' + e.message + '</div>'); });
}

function setTF(d, btnId) {
  days = d;
  var tids = ['tf-1m','tf-3m','tf-6m','tf-1y','tf-2y','tf-max'];
  for (var i = 0; i < tids.length; i++) {
    var el = document.getElementById(tids[i]);
    if (el) el.classList.remove('on');
  }
  var active = document.getElementById(btnId);
  if (active) active.classList.add('on');
  if (coinId) fetchData(coinId);
}

function setMode(m) {
  mode = m;
  document.getElementById('m-swing').classList.toggle('on', m === 'swing');
  document.getElementById('m-scalp').classList.toggle('on', m === 'scalp');
  if (coinId) fetchData(coinId);
}

function fetchData(id) {
  show('<div class="info">Loading ' + id + '...<br>Please wait a moment</div>');
  var interval = (parseInt(days) <= 7) ? 'hourly' : 'daily';
  var hdrs = {headers: {'x-cg-demo-api-key': KEY}};
  var url = CG + '/coins/' + id + '/market_chart?vs_currency=usd&days=' + days + '&interval=' + interval;
  var urlInfo = CG + '/coins/' + id + '?localization=false&tickers=false&community_data=false&developer_data=false';
  var urlMax = CG + '/coins/' + id + '/market_chart?vs_currency=usd&days=max&interval=daily';

  fetch(url, hdrs)
    .then(function(r) { return r.json(); })
    .then(function(cd) {
      if (!cd.prices || !cd.prices.length) {
        show('<div class="err">No data found for this coin.</div>');
        return;
      }
      priceData = cd.prices.map(function(p, i) {
        return { date: new Date(p[0]), price: p[1], vol: cd.total_volumes && cd.total_volumes[i] ? cd.total_volumes[i][1] : 0 };
      });
      volData = cd.total_volumes ? cd.total_volumes.map(function(v) { return v[1]; }) : [];
      dailyPrices = priceData.map(function(d) { return d.price; });
      weeklyPrices = dailyPrices;
      coinInfo = {};
      renderPage();
      fetch(urlInfo, hdrs).then(function(r) { return r.json(); }).then(function(info) { coinInfo = info; renderPage(); }).catch(function() {});
      fetch(urlMax, hdrs).then(function(r) { return r.json(); }).then(function(mx) { if (mx.prices) weeklyPrices = mx.prices.map(function(p) { return p[1]; }); renderPage(); }).catch(function() {});
    })
    .catch(function(e) { show('<div class="err">API Error: ' + e.message + '</div>'); });
}

function calcRSI(prices) {
  var period = 14;
  if (prices.length < period + 1) return 50;
  var ag = 0, al = 0, i, d;
  for (i = 1; i <= period; i++) { d = prices[i] - prices[i-1]; if (d > 0) ag += d; else al += -d; }
  ag /= period; al /= period;
  for (i = period; i < prices.length; i++) {
    d = prices[i] - prices[i-1];
    ag = (ag * 13 + (d > 0 ? d : 0)) / 14;
    al = (al * 13 + (d < 0 ? -d : 0)) / 14;
  }
  return al === 0 ? 100 : 100 - 100 / (1 + ag / al);
}

function calcEMA(prices, period) {
  if (prices.length < period) return [];
  var k = 2 / (period + 1), sum = 0, i;
  for (i = 0; i < period; i++) sum += prices[i];
  var r = [sum / period];
  for (i = period; i < prices.length; i++) r.push(prices[i] * k + r[r.length-1] * (1-k));
  return r;
}

function calcMACD(prices) {
  if (prices.length < 35) return { cross: false, turning: false };
  var ef = calcEMA(prices, 12), es = calcEMA(prices, 26);
  var ml = [], i;
  for (i = 0; i < es.length; i++) ml.push(ef[i + 14] - es[i]);
  if (ml.length < 9) return { cross: false, turning: false };
  var sl = calcEMA(ml, 9), diff = ml.length - sl.length;
  var hist = [];
  for (i = 0; i < sl.length; i++) hist.push(ml[i + diff] - sl[i]);
  var h = hist[hist.length-1] || 0, ph = hist[hist.length-2] || 0;
  return { cross: h > 0 && ph <= 0, turning: h > ph, macdLine: ml, histLine: hist };
}

function calcEWO(prices) {
  if (prices.length < 35) return 0;
  var m5 = 0, m35 = 0, i;
  for (i = prices.length-5; i < prices.length; i++) m5 += prices[i];
  for (i = prices.length-35; i < prices.length; i++) m35 += prices[i];
  return m5/5 - m35/35;
}

function findPivots(prices, minMove) {
  minMove = minMove || 0.10;
  var n = prices.length, win = Math.max(3, Math.floor(n/20));
  var pivots = [], i, sl, mx, mn;
  for (i = win; i < n - win; i++) {
    sl = prices.slice(i-win, i+win+1);
    mx = Math.max.apply(null, sl); mn = Math.min.apply(null, sl);
    if (prices[i] === mx && prices[i] > prices[i-1] && prices[i] > prices[i+1])
      pivots.push({ idx: i, price: prices[i], type: 'peak' });
    else if (prices[i] === mn && prices[i] < prices[i-1] && prices[i] < prices[i+1])
      pivots.push({ idx: i, price: prices[i], type: 'trough' });
  }
  var st = prices[0] < prices[Math.min(10, n-1)] ? 'trough' : 'peak';
  pivots.unshift({ idx: 0, price: prices[0], type: st });
  pivots.push({ idx: n-1, price: prices[n-1], type: 'current' });
  var sig = [pivots[0]], k, prev, curr, move;
  for (k = 1; k < pivots.length; k++) {
    prev = sig[sig.length-1]; curr = pivots[k];
    if (prev.type === curr.type) {
      if (curr.type === 'peak' && curr.price > prev.price) sig[sig.length-1] = curr;
      else if (curr.type === 'trough' && curr.price < prev.price) sig[sig.length-1] = curr;
      continue;
    }
    move = Math.abs((curr.price - prev.price) / prev.price);
    if (move >= minMove) sig.push(curr);
  }
  return sig;
}

function validateEW(pv) {
  var issues = [];
  if (pv.length >= 3) {
    var w1r = Math.abs(pv[1].price - pv[0].price);
    if (w1r > 0) {
      var w2r = Math.abs(pv[2].price - pv[1].price) / w1r * 100;
      if (pv[2].price < pv[0].price) issues.push('W2>100% W1');
      else if (w2r < 38) issues.push('W2 shallow(' + w2r.toFixed(0) + '%)');
    }
  }
  if (pv.length >= 4) { var w1s = Math.abs(pv[1].price-pv[0].price), w3s = Math.abs(pv[3].price-pv[2].price); if (w3s < w1s) issues.push('W3<W1'); }
  if (pv.length >= 5 && pv[4].price < pv[1].price) issues.push('W4 overlaps W1');
  return { valid: issues.length === 0, issues: issues };
}

// ── STOCHASTIC OSCILLATOR ─────────────────────────────────────
function calcStoch(prices, period) {
  period = period || 14;
  if (prices.length < period) return 50;
  var slice = prices.slice(-period);
  var high = Math.max.apply(null, slice);
  var low  = Math.min.apply(null, slice);
  if (high === low) return 50;
  return ((prices[prices.length-1] - low) / (high - low)) * 100;
}

function calcStochFull(prices, period) {
  period = period || 14;
  var result = [];
  for (var i = period; i <= prices.length; i++) {
    var slice = prices.slice(i-period, i);
    var high = Math.max.apply(null, slice);
    var low  = Math.min.apply(null, slice);
    if (high === low) { result.push(50); continue; }
    result.push(((prices[i-1]-low)/(high-low))*100);
  }
  return result;
}

// ── ALTERNATION RULE ──────────────────────────────────────────
function checkAlternation(waves) {
  // W2 and W4 should alternate in structure
  // If W2 is sharp (>50% retrace) → W4 should be shallow (<38%)
  // If W2 is shallow → W4 should be deeper
  if (waves.length < 5) return { valid: true, note: 'Need W4 to check' };
  var w1 = Math.abs(waves[1].price - waves[0].price);
  var w3 = Math.abs(waves[3].price - waves[2].price);
  if (w1 === 0 || w3 === 0) return { valid: true, note: 'Cannot calculate' };
  var w2ret = Math.abs(waves[2].price - waves[1].price) / w1 * 100;
  var w4ret = Math.abs(waves[4].price - waves[3].price) / w3 * 100;
  var alternates = false;
  var note = '';
  if (w2ret > 50 && w4ret < 40) { alternates = true; note = 'W2 sharp, W4 flat ✓'; }
  else if (w2ret < 40 && w4ret > 40) { alternates = true; note = 'W2 flat, W4 sharp ✓'; }
  else if (Math.abs(w2ret - w4ret) > 15) { alternates = true; note = 'Alternation present ✓'; }
  else { note = 'W2:' + w2ret.toFixed(0) + '% W4:' + w4ret.toFixed(0) + '% — similar depth'; }
  return { valid: alternates, note: note, w2ret: w2ret, w4ret: w4ret };
}

// ── CANDLESTICK PATTERNS ──────────────────────────────────────
function detectCandlestick(priceData) {
  if (!priceData || priceData.length < 3) return { pattern: 'None', bullish: false };
  var len = priceData.length;
  var c1 = priceData[len-1], c2 = priceData[len-2], c3 = priceData[len-3];
  if (!c1 || !c2 || !c3) return { pattern: 'None', bullish: false };

  // Use close prices as proxy (we only have close)
  var p1 = c1.price, p2 = c2.price, p3 = c3.price;

  // Hammer: last candle significantly above recent low
  var recentLow = Math.min(p1, p2, p3);
  var recentHigh = Math.max(p1, p2, p3);
  var range = recentHigh - recentLow;

  // Bullish Engulfing: price drops then strong reversal up
  if (p2 < p3 && p1 > p2 && (p1-p2) > (p3-p2)*0.5) {
    return { pattern: 'Bullish Engulfing', bullish: true };
  }
  // Hammer: sharp drop then recovery
  if (p2 < p3 * 0.97 && p1 > p2 * 1.02) {
    return { pattern: 'Hammer', bullish: true };
  }
  // Morning Star: 3-candle reversal
  if (p3 > p2 && p2 < p1 && p1 > (p3+p2)/2) {
    return { pattern: 'Morning Star', bullish: true };
  }
  // Doji: indecision at bottom
  if (Math.abs(p1-p2)/p2 < 0.005 && p2 < p3*0.98) {
    return { pattern: 'Doji (Reversal Signal)', bullish: true };
  }
  // Bearish: continued downtrend
  if (p1 < p2 && p2 < p3) {
    return { pattern: 'Downtrend Continuing', bullish: false };
  }
  return { pattern: 'No clear pattern', bullish: false };
}

// ── WAVE CHANNEL ─────────────────────────────────────────────
function calcChannel(waves, prices) {
  if (waves.length < 4) return { inChannel: true, note: 'Need more waves' };
  // Channel: line from W1 top to W3 top (for bullish impulse)
  // Current price should be below this channel line
  var w1 = waves[1], w3 = waves.length >= 4 ? waves[3] : null;
  if (!w1 || !w3) return { inChannel: true, note: 'Cannot calculate' };
  var current = prices[prices.length-1];
  // Simple check: current price vs W3 price
  var channelTop = Math.max(w1.price, w3.price);
  var channelBot = Math.min(waves[0].price, waves.length >= 3 ? waves[2].price : waves[0].price);
  var inChannel = current <= channelTop * 1.02 && current >= channelBot * 0.98;
  var note = inChannel ? 'Price within channel ✓' : 'Price outside channel ⚠️';
  return { inChannel: inChannel, note: note, top: channelTop, bottom: channelBot };
}

// ── ENDING DIAGONAL DETECTION ─────────────────────────────────
function detectEndingDiagonal(waves, prices) {
  // Ending diagonal at W5: each sub-wave shorter than previous
  // AND RSI divergence (price higher, RSI lower at W5 vs W3)
  if (waves.length < 5) return { detected: false, note: 'Need W5 data' };
  var w3 = waves[3], w5 = waves[4];
  if (!w3 || !w5) return { detected: false, note: 'Insufficient data' };
  var w3Size = Math.abs(waves[3].price - waves[2].price);
  var w5Size = Math.abs(waves[4].price - (waves.length >= 6 ? waves[5].price : waves[4].price));
  // Check RSI divergence
  var rsiW3 = calcRSI(prices.slice(0, Math.min(w3.idx+1, prices.length)));
  var rsiW5 = calcRSI(prices.slice(0, Math.min(w5.idx+1, prices.length)));
  var priceDiverge = w5.price >= w3.price;
  var rsiDiverge   = rsiW5 < rsiW3;
  var diagonal = priceDiverge && rsiDiverge;
  var note = diagonal ?
    'Ending diagonal detected — reversal likely soon' :
    'No ending diagonal';
  return { detected: diagonal, note: note, rsiW3: rsiW3, rsiW5: rsiW5 };
}

function verifyWaves(waves,prices,vols) {
  if(!waves||waves.length<3) return{score:0,passed:0,total:0,results:[],confidence:'LOW'};
  var res=[],tot=0,pass=0;
  function rsiAt(idx){var end=Math.min(idx+1,prices.length);return calcRSI(prices.slice(0,end));}
  function volAt(idx){if(!vols||!vols.length)return 0;var s=Math.max(0,idx-3),e=Math.min(vols.length-1,idx+3),sum=0,n=0;for(var j=s;j<=e;j++){sum+=vols[j]||0;n++;}return n?sum/n:0;}
  if(waves.length>=3){var w1r=Math.abs(waves[1].price-waves[0].price),w2r=w1r>0?Math.abs(waves[2].price-waves[1].price)/w1r*100:0,ok=w2r>=38&&w2r<=78.6;tot++;if(ok)pass++;res.push({wave:'W2',check:'Fib 38-78%',ok:ok,detail:w2r.toFixed(0)+'% retrace'});}
  if(waves.length>=4){var w1s=Math.abs(waves[1].price-waves[0].price),w3s=Math.abs(waves[3].price-waves[2].price),ok2=w3s>=w1s;tot++;if(ok2)pass++;res.push({wave:'W3',check:'Ext >100%',ok:ok2,detail:(w1s>0?w3s/w1s*100:0).toFixed(0)+'% of W1'});}
  if(waves.length>=5){var w3s2=Math.abs(waves[3].price-waves[2].price),w4r=w3s2>0?Math.abs(waves[4].price-waves[3].price)/w3s2*100:0,ok3=w4r>=23&&w4r<=50;tot++;if(ok3)pass++;res.push({wave:'W4',check:'Fib 23-50%',ok:ok3,detail:w4r.toFixed(0)+'% retrace'});}
  if(waves.length>=3){var r2=rsiAt(waves[2].idx),ok4=r2<50;tot++;if(ok4)pass++;res.push({wave:'W2',check:'RSI Oversold',ok:ok4,detail:'RSI:'+r2.toFixed(0)});}
  if(waves.length>=4){var r3=rsiAt(waves[3].idx),ok5=r3>55;tot++;if(ok5)pass++;res.push({wave:'W3',check:'RSI Strong',ok:ok5,detail:'RSI:'+r3.toFixed(0)});}
  if(waves.length>=4&&vols&&vols.length){var v1=volAt(waves[1].idx),v3=volAt(waves[3].idx),ok6=v3>=v1*0.7;tot++;if(ok6)pass++;res.push({wave:'W3',check:'Vol Strong',ok:ok6,detail:ok6?'W3 vol strong':'W3 vol weak'});}
  if(waves.length>=5&&vols&&vols.length){var v3b=volAt(waves[3].idx),v4=volAt(waves[4].idx),ok7=v4<=v3b*1.2;tot++;if(ok7)pass++;res.push({wave:'W4',check:'Vol Decline',ok:ok7,detail:ok7?'Vol declining':'Vol too high'});}
  var pct=tot>0?pass/tot*100:0,conf=pct>=80?'HIGH':pct>=60?'MEDIUM':pct>=40?'LOW':'VERY LOW';
  return{score:pct,passed:pass,total:tot,results:res,confidence:conf};
}


function detectEntry(pv) {
  if (pv.length < 3) return '';
  var w1r = Math.abs(pv[1].price - pv[0].price);
  if (w1r > 0) { var w2r = Math.abs(pv[2].price - pv[1].price) / w1r * 100; if (w2r >= 38 && w2r <= 100) return 'W2'; }

  return '';
}

function drawStoch(vals) {
  var c=document.getElementById('stochChart');if(!c||!vals.length)return;
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth,H=65;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  // Zones
  ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*0.8,cW,cH*0.2);
  ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*0.2);
  [20,50,80].forEach(function(v){
    var y=P.t+cH*(1-v/100);
    ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';
    ctx.fillText(v,P.l-3,y+3);
  });
  function xS(i){return P.l+(i/(vals.length-1))*cW;}
  function yS(v){return P.t+cH*(1-v/100);}
  ctx.beginPath();ctx.strokeStyle='#a855f7';ctx.lineWidth=1.5;
  for(var i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}
  ctx.stroke();
  var last=vals[vals.length-1];
  ctx.fillStyle=last<20?'#22c55e':last>80?'#ef4444':'#a855f7';
  ctx.font='bold 9px monospace';ctx.textAlign='left';
  ctx.fillText('STOCH '+last.toFixed(0),P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';
  ctx.fillText('STOCH',P.l-3,P.t+8);
}

function drawPrice(prices, waves, sl, tps) {

  var mn=Math.min.apply(null,prices)*0.97,mx=Math.max.apply(null,prices)*1.03,rng=mx-mn||1;
  function xS(i){return P.l+(i/(prices.length-1))*cW;}
  function yS(p){return P.t+cH-((p-mn)/rng)*cH;}
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<=5;i++){var y=P.t+(i/5)*cH,pr=mx-(i/5)*rng;ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(fp(pr),P.l-3,y+3);}
  var step=Math.max(1,Math.floor(priceData.length/5));
  for(i=0;i<priceData.length;i+=step){var d=priceData[i].date;var lbl=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});ctx.fillStyle='#334155';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(lbl,xS(i),H-4);}
  var slY=yS(sl);if(slY>=P.t&&slY<=P.t+cH){ctx.strokeStyle='#ef444466';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(P.l,slY);ctx.lineTo(P.l+cW,slY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ef4444';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText('SL',P.l+cW+2,slY+3);}
  var tpLabels=['TP1','TP2','TP3','TP4'];
  for(var t=0;t<tps.length;t++){var tpY=yS(tps[t]);if(tpY<P.t||tpY>P.t+cH)continue;ctx.strokeStyle='#22c55e44';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(P.l,tpY);ctx.lineTo(P.l+cW,tpY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#22c55e';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText(tpLabels[t],P.l+cW+2,tpY+3);}
  var gr=ctx.createLinearGradient(0,P.t,0,P.t+cH);gr.addColorStop(0,'rgba(240,180,41,0.18)');gr.addColorStop(1,'rgba(240,180,41,0.01)');
  ctx.beginPath();for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}
  ctx.lineTo(xS(prices.length-1),P.t+cH);ctx.lineTo(xS(0),P.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#f0b429';ctx.lineWidth=2;for(i=0;i<prices.length;i++){i===0?ctx.moveTo(xS(i),yS(prices[i])):ctx.lineTo(xS(i),yS(prices[i]));}ctx.stroke();
  if(waves.length>1){ctx.beginPath();ctx.strokeStyle='rgba(240,180,41,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);for(i=0;i<waves.length;i++){i===0?ctx.moveTo(xS(waves[i].idx),yS(waves[i].price)):ctx.lineTo(xS(waves[i].idx),yS(waves[i].price));}ctx.stroke();ctx.setLineDash([]);}
  for(i=0;i<waves.length;i++){var w=waves[i],x=xS(w.idx),y=yS(w.price),top=w.type==='peak',off=top?-22:22;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=w.color;ctx.fill();ctx.fillStyle=w.color;ctx.fillRect(x-17,y+off-9,34,16);ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(w.label,x,y+off+3);ctx.fillStyle=w.color;ctx.font='7px monospace';ctx.fillText(fp(w.price),x,y+off+(top?-13:19));}
}

function drawRSI(prices) {
  var c=document.getElementById('rsiChart');if(!c)return;
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth,H=65;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  var vals=[],i;for(i=14;i<prices.length;i++)vals.push(calcRSI(prices.slice(0,i+1)));
  if(!vals.length)return;
  ctx.fillStyle='#ef444408';ctx.fillRect(P.l,P.t,cW,cH*(1-70/100));
  ctx.fillStyle='#22c55e08';ctx.fillRect(P.l,P.t+cH*(1-30/100),cW,cH*30/100);
  [30,50,70].forEach(function(v){var y=P.t+cH*(1-v/100);ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(v,P.l-3,y+3);});
  function xS(i){return P.l+(i/(vals.length-1))*cW;}function yS(v){return P.t+cH*(1-v/100);}
  ctx.beginPath();ctx.strokeStyle='#f97316';ctx.lineWidth=1.5;
  for(i=0;i<vals.length;i++){i===0?ctx.moveTo(xS(i),yS(vals[i])):ctx.lineTo(xS(i),yS(vals[i]));}ctx.stroke();
  var last=vals[vals.length-1];ctx.fillStyle=last<30?'#22c55e':last>70?'#ef4444':'#f97316';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('RSI '+last.toFixed(1),P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('RSI',P.l-3,P.t+8);
}

function drawMACD(macdRes) {
  var c=document.getElementById('macdChart');if(!c)return;
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth,H=65;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  var hist=macdRes.histLine||[];if(!hist.length)return;
  var mx=Math.max.apply(null,hist.map(Math.abs))*1.1||1,yMid=P.t+cH/2,i;
  function xS(i){return P.l+(i/(hist.length-1))*cW;}function yS(v){return yMid-(v/mx)*(cH/2);}
  ctx.strokeStyle='#334155';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,yMid);ctx.lineTo(P.l+cW,yMid);ctx.stroke();
  var bw=Math.max(1,cW/hist.length-0.5);
  for(i=0;i<hist.length;i++){var x=xS(i),y=yS(hist[i]);ctx.fillStyle=hist[i]>=0?'#22c55e66':'#ef444466';ctx.fillRect(x-bw/2,Math.min(y,yMid),bw,Math.abs(y-yMid));}
  var last=hist[hist.length-1]||0;ctx.fillStyle=last>=0?'#22c55e':'#ef4444';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('MACD',P.l+cW+2,P.t+cH/2+3);
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('MACD',P.l-3,P.t+8);
}

function drawVol(vols) {
  var c=document.getElementById('volChart');if(!c||!vols.length)return;
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.offsetWidth,H=50;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  var maxV=Math.max.apply(null,vols)||1,bw=Math.max(1,cW/vols.length-0.5),i;
  for(i=0;i<vols.length;i++){var x=P.l+(i/(vols.length-1))*cW,hh=(vols[i]/maxV)*cH,up=i>0&&priceData[i]&&priceData[i-1]&&priceData[i].price>=priceData[i-1].price;ctx.fillStyle=up?'#22c55e44':'#ef444444';ctx.fillRect(x-bw/2,P.t+cH-hh,bw,hh);}
  ctx.fillStyle='#475569';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('VOL',P.l-3,P.t+8);
}
