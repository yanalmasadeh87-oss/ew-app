<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080c14;--bg2:#0d1421;--bg3:#111827;--border:#1e293b;
  --gold:#f0b429;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;
  --orange:#f97316;--text:#e2e8f0;--muted:#64748b

body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:12px;min-height:100vh}
h1{font-size:20px;font-weight:900;background:linear-gradient(90deg,#f0b429,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2px}

.row{display:flex;gap:6px;margin-bottom:10px}
input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'Courier New',monospace;font-size:13px;outline:none}

canvas{width:100%!important;display:block;border-radius:4px}

<body>

<h1>EW STRATEGY V3</h1>
<div class="sub">YOUR WAVE STRUCTURE · 18-POINT VALIDATION · MULTI-TIMEFRAME</div>

<div class="row">
  <input type="text" id="inp" placeholder="Search coin (bitcoin, xrp, solana...)">
  <button class="gbtn" onclick="doSearch()">GO</button>
</div>

<div class="coins">
  <button class="cbtn" onclick="loadCoin('bitcoin','BTC')">BTC</button>
  <button class="cbtn" onclick="loadCoin('ripple','XRP')">XRP</button>
  <button class="cbtn" onclick="loadCoin('ethereum','ETH')">ETH</button>
  <button class="cbtn" onclick="loadCoin('solana','SOL')">SOL</button>
  <button class="cbtn" onclick="loadCoin('binancecoin','BNB')">BNB</button>
  <button class="cbtn" onclick="loadCoin('cardano','ADA')">ADA</button>
</div>

<div class="modes">
  <button class="mbtn on" onclick="setMode('swing')">SWING</button>
  <button class="mbtn" onclick="setMode('scalp')">SCALP</button>
</div>

<div class="tfs" id="tfs">
  <button class="tbtn" onclick="setTF('30',this)">1M</button>
  <button class="tbtn" onclick="setTF('90',this)">3M</button>
  <button class="tbtn" onclick="setTF('180',this)">6M</button>
  <button class="tbtn" onclick="setTF('365',this)">1Y</button>
  <button class="tbtn" onclick="setTF('730',this)">2Y</button>
  <button class="tbtn on" onclick="setTF('max',this)">MAX</button>
</div>

<div id="main"><div class="info">Tap a coin button or type a coin name and tap GO</div></div>

<div class="disc">FOR EDUCATIONAL PURPOSES ONLY · NOT FINANCIAL ADVICE<br>SPOT TRADING ONLY · HALAL COINS · ALWAYS MANAGE YOUR RISK</div>

<script>
window.onerror = function(msg, url, line) {
  document.getElementById('main').innerHTML = '<div style="color:red;padding:20px;font-size:12px">JS Error line ' + line + ': ' + msg + '</div>';
  return true;
};
var KEY = 'CG-DJnA8sWPRSUuF8Xz27Fhastn';
var CG  = 'https://api.coingecko.com/api/v3';
var SL  = 0.05;

var state = {
  coinId: '',
  days: 'max',
  mode: 'swing',
  data: [],
  info: {},
  vols: [],
  daily: [],
  weekly: []
};

// ── SETUP EVENTS ───────────────────────────────────────────────
// ── INLINE FUNCTIONS FOR BUTTONS ──────────────────────────────
function doSearch() {
  var v = document.getElementById('inp').value.trim().toLowerCase();
  if (!v) return;
  searchCoin(v);
}

function loadCoin(id, sym) {
  document.getElementById('inp').value = sym;
  state.coinId = id;
  loadData(id);
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mbtn').forEach(function(b) { b.classList.remove('on'); });
  if (m === 'swing') {
    document.querySelectorAll('.mbtn')[0].classList.add('on');
    document.getElementById('tfs').innerHTML = '<button class="tbtn" onclick="setTF(30,this)">1M</button><button class="tbtn" onclick="setTF(90,this)">3M</button><button class="tbtn" onclick="setTF(180,this)">6M</button><button class="tbtn" onclick="setTF(365,this)">1Y</button><button class="tbtn" onclick="setTF(730,this)">2Y</button><button class="tbtn on" onclick="setTF('max',this)">MAX</button>';
    state.days = 'max';
  } else {
    document.querySelectorAll('.mbtn')[1].classList.add('on');
    document.getElementById('tfs').innerHTML = '<button class="tbtn on" onclick="setTF(1,this)">1D</button><button class="tbtn" onclick="setTF(3,this)">3D</button><button class="tbtn" onclick="setTF(7,this)">1W</button><button class="tbtn" onclick="setTF(14,this)">2W</button>';
    state.days = 1;
  }
  if (state.coinId) loadData(state.coinId);
}

function setTF(d, btn) {
  state.days = d;
  document.querySelectorAll('.tbtn').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  if (state.coinId) loadData(state.coinId);
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('inp').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doSearch();
  });
  loadCoin('bitcoin', 'BTC');
});

function buildTFs(days, active) {
  var html = '';
  days.forEach(function(d) {
    var lbl = d === 'max' ? 'MAX' : d <= 6 ? d + 'D' : d <= 13 ? d + 'D' : d == 14 ? '2W' : d == 30 ? '1M' : d == 90 ? '3M' : d == 180 ? '6M' : d == 365 ? '1Y' : '2Y';
    html += '<button class="tbtn' + (d === active ? ' on' : '') + '" data-days="' + d + '">' + lbl + '</button>';
  });
  document.getElementById('tfs').innerHTML = html;
  state.days = active;
}

// ── SEARCH ─────────────────────────────────────────────────────
function searchCoin(q) {
  show('<div class="info">Searching for ' + q + '...</div>');
  fetch(CG + '/search?query=' + encodeURIComponent(q) + '&x_cg_demo_api_key=' + KEY)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.coins || !d.coins.length) {
        show('<div class="err">Coin not found. Try full name like "bitcoin"</div>');
        return;
      }
      state.coinId = d.coins[0].id;
      loadData(state.coinId);
    })
    .catch(function(e) {
      show('<div class="err">Search error: ' + e.message + '</div>');
    });
}

// ── LOAD DATA ──────────────────────────────────────────────────
function loadData(id) {
  show('<div class="info">Loading ' + id + '...<br>Please wait</div>');
  var interval = (state.days <= 7) ? 'hourly' : 'daily';
  var days = state.days;
  var url1 = CG + '/coins/' + id + '/market_chart?vs_currency=usd&days=' + days + '&interval=' + interval + '&x_cg_demo_api_key=' + KEY;
  var url2 = CG + '/coins/' + id + '?localization=false&tickers=false&community_data=false&developer_data=false&x_cg_demo_api_key=' + KEY;
  var url3 = CG + '/coins/' + id + '/market_chart?vs_currency=usd&days=max&interval=daily&x_cg_demo_api_key=' + KEY;

  fetch(url1)
    .then(function(r) { return r.json(); })
    .then(function(cd) {
      if (!cd.prices || !cd.prices.length) {
        show('<div class="err">No price data found.</div>'); return;
      }
      state.data = cd.prices.map(function(p,i) {
        return { date: new Date(p[0]), price: p[1], vol: cd.total_volumes && cd.total_volumes[i] ? cd.total_volumes[i][1] : 0 };
      });
      state.vols = cd.total_volumes ? cd.total_volumes.map(function(v){return v[1];}) : [];
      state.daily = state.data.map(function(d){return d.price;});
      state.weekly = state.data.map(function(d){return d.price;});
      state.info = {};
      render();
      fetch(url2).then(function(r){return r.json();}).then(function(info){
        state.info = info;
        render();
      }).catch(function(){});
      fetch(url3).then(function(r){return r.json();}).then(function(cd3){
        if(cd3.prices) state.weekly = cd3.prices.map(function(p){return p[1];});
        render();
      }).catch(function(){});
    })
    .catch(function(e) {
      show('<div class="err">Error: ' + e.message + '</div>');
    });
}

// ── INDICATORS ─────────────────────────────────────────────────
function calcRSI(prices, period) {
  period = period || 14;
  if (prices.length < period + 1) return 50;
  var ag = 0, al = 0;
  for (var i = 1; i <= period; i++) {
    var d = prices[i] - prices[i-1];
    if (d > 0) ag += d; else al += Math.abs(d);
  }
  ag /= period; al /= period;
  for (var j = period; j < prices.length; j++) {
    var diff = prices[j] - prices[j-1];
    var g = diff > 0 ? diff : 0;
    var l = diff < 0 ? Math.abs(diff) : 0;
    ag = (ag * (period-1) + g) / period;
    al = (al * (period-1) + l) / period;
  }
  return al === 0 ? 100 : 100 - (100 / (1 + ag/al));
}

function calcEMA(prices, period) {
  if (prices.length < period) return [];
  var k = 2 / (period + 1);
  var sum = 0;
  for (var i = 0; i < period; i++) sum += prices[i];
  var r = [sum / period];
  for (var j = period; j < prices.length; j++) r.push(prices[j] * k + r[r.length-1] * (1-k));
  return r;
}

function calcMACD(prices) {
  if (prices.length < 35) return { cross: false, turning: false, hist: 0 };
  var ef = calcEMA(prices, 12);
  var es = calcEMA(prices, 26);
  var off = 26 - 12;
  var ml = [];
  for (var i = 0; i < es.length; i++) ml.push(ef[i+off] - es[i]);
  if (ml.length < 9) return { cross: false, turning: false, hist: 0 };
  var sl = calcEMA(ml, 9);
  var diff = ml.length - sl.length;
  var hist = [];
  for (var j = 0; j < sl.length; j++) hist.push(ml[j+diff] - sl[j]);
  var h = hist[hist.length-1] || 0;
  var ph = hist[hist.length-2] || 0;
  return { cross: h > 0 && ph <= 0, turning: h > ph, hist: h, prev: ph };
}

function calcEWO(prices) {
  if (prices.length < 35) return 0;
  var ma5 = 0, ma35 = 0;
  for (var i = prices.length-5; i < prices.length; i++) ma5 += prices[i];
  for (var j = prices.length-35; j < prices.length; j++) ma35 += prices[j];
  return (ma5/5) - (ma35/35);
}

// ── WAVE DETECTION ─────────────────────────────────────────────
function findPivots(prices, minMove) {
  minMove = minMove || 0.10;
  var n = prices.length;
  if (n < 20) return [];
  var win = Math.max(3, Math.floor(n/20));
  var pivots = [];

  for (var i = win; i < n-win; i++) {
    var sl = prices.slice(i-win, i+win+1);
    var mx = Math.max.apply(null, sl);
    var mn = Math.min.apply(null, sl);
    if (prices[i] === mx && prices[i] > prices[i-1] && prices[i] > prices[i+1])
      pivots.push({ idx: i, price: prices[i], type: 'peak' });
    else if (prices[i] === mn && prices[i] < prices[i-1] && prices[i] < prices[i+1])
      pivots.push({ idx: i, price: prices[i], type: 'trough' });
  }

  var st = prices[0] < prices[Math.min(10, n-1)] ? 'trough' : 'peak';
  pivots.unshift({ idx: 0, price: prices[0], type: st });
  pivots.push({ idx: n-1, price: prices[n-1], type: 'current' });

  var sig = [pivots[0]];
  for (var k = 1; k < pivots.length; k++) {
    var prev = sig[sig.length-1], curr = pivots[k];
    if (prev.type === curr.type) {
      if (curr.type === 'peak' && curr.price > prev.price) sig[sig.length-1] = curr;
      else if (curr.type === 'trough' && curr.price < prev.price) sig[sig.length-1] = curr;
      continue;
    }
    if (Math.abs((curr.price - prev.price) / prev.price) >= minMove) sig.push(curr);
  }
  return sig;
}

function validateEW(pivots) {
  var issues = [];
  if (pivots.length >= 3) {
    var w1r = Math.abs(pivots[1].price - pivots[0].price);
    if (w1r > 0) {
      var w2ret = Math.abs(pivots[2].price - pivots[1].price) / w1r * 100;
      if (pivots[2].price < pivots[0].price) issues.push('W2 > 100% W1');
      else if (w2ret < 38) issues.push('W2 shallow (' + w2ret.toFixed(0) + '%)');
    }
  }
  if (pivots.length >= 4) {
    var w1sz = Math.abs(pivots[1].price - pivots[0].price);
    var w3sz = Math.abs(pivots[3].price - pivots[2].price);
    if (w3sz < w1sz) issues.push('W3 < W1');
  }
  if (pivots.length >= 5) {
    if (pivots[4].price < pivots[1].price) issues.push('W4 overlaps W1');
  }
  return { valid: issues.length === 0, issues: issues };
}

function labelWaves(pivots) {
  var labels = ['W1','W2','W3','W4','W5','Wave A','Wave B','Wave C'];
  return pivots.slice(0, 8).map(function(p, i) {
    return {
      label: labels[i] || ('P' + (i+1)),
      price: p.price,
      type:  p.type,
      idx:   p.idx,
      date:  state.data[p.idx] ? state.data[p.idx].date : new Date(),
      color: p.type === 'peak' ? '#22c55e' : p.type === 'trough' ? '#ef4444' : '#f0b429'
    };
  });
}

function detectEntry(waves) {
  if (waves.length < 3) return '';
  var w1r = Math.abs(waves[1].price - waves[0].price);
  if (w1r > 0) {
    var w2ret = Math.abs(waves[2].price - waves[1].price) / w1r * 100;
    if (w2ret >= 38 && w2ret <= 100) return 'W2';
  }
  if (waves.length >= 5) {
    var w3r = Math.abs(waves[3].price - waves[2].price);
    if (w3r > 0) {
      var w4ret = Math.abs(waves[4].price - waves[3].price) / w3r * 100;
      if (w4ret >= 23 && w4ret <= 38 && waves[4].price > waves[1].price) return 'W4';
    }
  }
  return '';
}

// ── FORMAT ─────────────────────────────────────────────────────
function fp(p) {
  if (!p && p !== 0) return 'N/A';
  if (p >= 1000) return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (p >= 1) return '$' + p.toFixed(4);
  if (p >= 0.01) return '$' + p.toFixed(5);
  return '$' + p.toFixed(7);
}
function fpc(p) { return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }

// ── RENDER ─────────────────────────────────────────────────────
function render() {
  var prices  = state.data.map(function(d) { return d.price; });
  var vols    = state.vols;
  var current = prices[prices.length-1];
  var ath     = state.info && state.info.market_data && state.info.market_data.ath ? state.info.market_data.ath.usd : Math.max.apply(null, state.weekly.length ? state.weekly : prices);
  var chg     = state.info && state.info.market_data ? (state.info.market_data.price_change_percentage_24h || 0) : 0;
  var name    = state.info.name || state.coinId.toUpperCase();
  var sym     = state.info.symbol ? state.info.symbol.toUpperCase() : '';
  var pctATH  = ((current - ath) / ath) * 100;

  var rsiVal  = calcRSI(prices);
  var macdRes = calcMACD(prices);
  var ewoVal  = calcEWO(prices);

  var sens   = state.days <= 7 ? 0.03 : state.days <= 30 ? 0.05 : 0.10;
  var pivots = findPivots(prices, sens);
  var ewRes  = validateEW(pivots);
  var waves  = labelWaves(pivots);
  var entry  = detectEntry(waves);

  var sl  = current * 0.95;
  var tp1 = current * 1.05;
  var tp2 = current * 1.10;
  var tp3 = current * 1.15;
  var tp4 = current * 1.20;

  // 18-point checklist
  var prices_daily = state.daily;
  var ma50 = 0;
  if (prices_daily.length >= 50) {
    for (var i = prices_daily.length-50; i < prices_daily.length; i++) ma50 += prices_daily[i];
    ma50 /= 50;
  } else { ma50 = current; }

  var weekly_prices = state.weekly;
  var wma50 = 0;
  if (weekly_prices.length >= 50) {
    for (var i = weekly_prices.length-50; i < weekly_prices.length; i++) wma50 += weekly_prices[i];
    wma50 /= 50;
  } else { wma50 = current; }

  var weekly_bull = current > wma50;
  var daily_bull  = current > ma50 || pctATH < -50;

  var vol_dec = false;
  if (vols.length >= 10) {
    var r5 = 0, p5 = 0;
    for (var i = vols.length-5; i < vols.length; i++) r5 += vols[i];
    for (var i = vols.length-10; i < vols.length-5; i++) p5 += vols[i];
    vol_dec = (r5/5) < (p5/5);
  }

  var vol_exp = vols.length > 1 && vols[vols.length-1] > vols[vols.length-2];

  var checks = [
    { l: 'Weekly Macro Bullish',         ok: weekly_bull,                  cat: 'TF'     },
    { l: 'Daily Trend Bullish',           ok: daily_bull,                   cat: 'TF'     },
    { l: '4H Structure Aligned',          ok: state.daily.length > 0,       cat: 'TF'     },
    { l: 'Golden Rule — All TF Aligned',  ok: weekly_bull && daily_bull,    cat: 'TF'     },
    { l: '5-Wave Impulse Detected',       ok: waves.length >= 5,            cat: 'EW'     },
    { l: 'EW Rules Valid (W2,W3,W4)',     ok: ewRes.valid,                  cat: 'EW'     },
    { l: 'W2 or W4 Entry Zone',           ok: entry !== '',                 cat: 'EW'     },
    { l: 'Price -40%+ from ATH',          ok: pctATH < -40,                 cat: 'Price'  },
    { l: 'Price -60%+ from ATH (Deep)',   ok: pctATH < -60,                 cat: 'Price'  },
    { l: 'Fibonacci 0.382-0.786 Hit',     ok: pctATH < -38 && pctATH > -90, cat: 'Fib'   },
    { l: 'RSI Below 45 (Now: ' + rsiVal.toFixed(1) + ')', ok: rsiVal < 45,  cat: 'Mom'   },
    { l: 'MACD Bullish',                  ok: macdRes.cross || macdRes.turning, cat: 'Mom'},
    { l: 'EWO Signal Active',             ok: ewoVal !== 0,                 cat: 'Mom'    },
    { l: 'Volume Declining (Correction)', ok: vol_dec,                      cat: 'Vol'    },
    { l: 'Volume Expanding (Reversal)',   ok: vol_exp,                      cat: 'Vol'    },
    { l: 'Volume Confirms Structure',     ok: vol_dec || vol_exp,           cat: 'Vol'    },
    { l: 'ABC Correction Structure',      ok: waves.length >= 6,            cat: 'Struct' },
    { l: 'No W1/W4 Overlap',             ok: ewRes.valid,                  cat: 'Struct' },
  ];

  var score = 0;
  for (var i = 0; i < checks.length; i++) if (checks[i].ok) score++;

  var status, statusColor;
  if      (score >= 15) { status = 'STRONG SIGNAL — High Confidence';       statusColor = '#22c55e'; }
  else if (score >= 12) { status = 'WATCH — Medium-High Confidence';        statusColor = '#f0b429'; }
  else if (score >= 9)  { status = 'DEVELOPING — Medium Confidence';        statusColor = '#f97316'; }
  else                  { status = 'NO SIGNAL — Wait for better setup';     statusColor = '#ef4444'; }

  var conf;
  if      (score >= 15) conf = 'HIGH CONFIDENCE — Full position size';
  else if (score >= 12) conf = 'MEDIUM-HIGH — 75% position size';
  else if (score >= 9)  conf = 'MEDIUM — 50% position size';
  else                  conf = 'LOW — Skip this trade';

  var alternate = '';
  if (!ewRes.valid)      alternate = 'Alternate: ABC zigzag correction in progress';
  else if (pctATH < -70) alternate = 'Alternate: Extended W2 — deep accumulation zone';
  else if (pctATH < -40) alternate = 'Alternate: W4 correction within larger W3';

  var html = '';

  // Header
  html += '<div style="text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:12px">' + name + ' (' + sym + ') · ' + state.mode.toUpperCase() + ' · ' + (state.days === 'max' ? 'MAX' : state.days + 'D') + '</div>';

  // Price card
  html += '<div class="card"><div class="ph">';
  html += '<div><div class="ct">LIVE PRICE</div><div class="pbig">' + fp(current) + '</div>';
  html += '<div style="font-size:11px;color:' + (chg>=0?'var(--green)':'var(--red)') + ';margin-top:2px">' + fpc(chg) + ' 24H</div></div>';
  html += '<div style="text-align:right;font-size:10px;color:var(--muted);line-height:2">';
  html += '<div>ATH: <span style="color:var(--gold)">' + fp(ath) + '</span></div>';
  html += '<div>From ATH: <span style="color:var(--red)">' + fpc(pctATH) + '</span></div>';
  html += '<div>RSI: <span style="color:' + (rsiVal<30?'var(--green)':rsiVal>70?'var(--red)':'var(--orange)') + '">' + rsiVal.toFixed(1) + '</span></div>';
  html += '<div>EWO: <span style="color:' + (ewoVal>0?'var(--green)':'var(--red)') + '">' + (ewoVal>0?'Bullish':'Bearish') + '</span></div>';
  if (entry) html += '<div>Zone: <span style="color:var(--green)">' + entry + ' Bottom</span></div>';
  html += '</div></div></div>';

  // Chart
  html += '<div class="card" style="padding:10px"><div class="ct">PRICE + WAVES + SIGNAL LEVELS</div><canvas id="priceChart"></canvas></div>';
  html += '<div class="card" style="padding:8px"><canvas id="rsiChart"></canvas></div>';
  html += '<div class="card" style="padding:8px"><canvas id="macdChart"></canvas></div>';
  html += '<div class="card" style="padding:8px"><canvas id="volChart"></canvas></div>';

  // Status
  html += '<div class="sb" style="background:' + statusColor + '18;border:1px solid ' + statusColor + '44;color:' + statusColor + '">' + status + '</div>';

  // Alternate
  if (alternate) html += '<div style="padding:8px 12px;border-radius:5px;font-size:10px;margin-bottom:8px;border:1px solid #f0b42933;color:#f0b429;background:#f0b42908">' + alternate + '</div>';

  // Signal levels
  html += '<div class="card"><div class="ct">SIGNAL LEVELS</div><div class="g2">';
  html += '<div class="si" style="border-color:#22c55e33;grid-column:1/-1"><div class="sl">ENTRY ZONE</div><div class="sv" style="color:var(--green)">' + fp(current*0.99) + ' – ' + fp(current*1.01) + '</div></div>';
  html += '<div class="si" style="border-color:#f0b42933"><div class="sl">TP1 (+5%)</div><div class="sv" style="color:var(--gold)">' + fp(tp1) + '</div></div>';
  html += '<div class="si" style="border-color:#f0b42933"><div class="sl">TP2 (+10%)</div><div class="sv" style="color:var(--gold)">' + fp(tp2) + '</div></div>';
  html += '<div class="si" style="border-color:#f0b42933"><div class="sl">TP3 (+15%)</div><div class="sv" style="color:var(--gold)">' + fp(tp3) + '</div></div>';
  html += '<div class="si" style="border-color:#f0b42933"><div class="sl">TP4 (+20%)</div><div class="sv" style="color:var(--gold)">' + fp(tp4) + '</div></div>';
  html += '<div class="si" style="border-color:#ef444433;grid-column:1/-1"><div class="sl">STOP LOSS (-5%)</div><div class="sv" style="color:var(--red)">' + fp(sl) + '</div></div>';
  html += '</div></div>';

  // Wave count
  html += '<div class="card"><div class="ct">WAVE COUNT — YOUR EW STRUCTURE</div>';
  for (var i = 0; i < waves.length; i++) {
    var w = waves[i];
    var dt = w.date ? w.date.toLocaleDateString('en-US', { month:'short', year:'numeric' }) : '';
    html += '<div class="wr"><span style="color:' + w.color + ';font-weight:900;min-width:60px">' + w.label + '</span><span style="color:var(--muted);font-size:9px">' + dt + '</span><span style="font-weight:700">' + fp(w.price) + '</span><span style="font-size:9px;color:' + w.color + '">' + (w.type==='peak'?'▲ TOP':w.type==='trough'?'▼ BOT':'● NOW') + '</span></div>';
  }
  if (!ewRes.valid) html += '<div style="font-size:10px;color:var(--red);margin-top:8px;padding:6px;background:#ef444411;border-radius:4px">⚠️ EW Issues: ' + ewRes.issues.join(' · ') + '</div>';
  else html += '<div style="font-size:10px;color:var(--green);margin-top:8px">✅ All EW Rules Valid</div>';
  html += '</div>';

  // Checklist
  html += '<div class="card"><div class="ct">18-POINT CHECKLIST — ' + score + '/18</div>';
  html += '<div class="sbar"><div class="sfill" style="width:' + (score/18*100).toFixed(0) + '%;background:' + (score>=15?'var(--green)':score>=12?'var(--gold)':score>=9?'var(--orange)':'var(--red)') + '"></div></div>';
  html += '<div style="margin:8px 0 10px;font-size:10px;color:var(--muted)">';
  var cats = ['TF','EW','Price','Fib','Mom','Vol','Struct'];
  for (var c = 0; c < cats.length; c++) {
    var cat = cats[c];
    var catOk = 0, catTotal = 0;
    for (var j = 0; j < checks.length; j++) { if (checks[j].cat === cat) { catTotal++; if (checks[j].ok) catOk++; } }
    html += '<span style="color:' + (catOk===catTotal?'var(--green)':catOk>0?'var(--gold)':'var(--red)') + ';margin-right:8px">' + cat + ' ' + catOk + '/' + catTotal + '</span>';
  }
  html += '</div>';
  for (var i = 0; i < checks.length; i++) {
    var ck = checks[i];
    html += '<div class="ci" style="background:' + (ck.ok?'#22c55e0d':'#ef44440d') + ';border:1px solid ' + (ck.ok?'#22c55e22':'#ef444422') + '"><span style="font-size:13px;min-width:20px">' + (ck.ok?'✅':'❌') + '</span><span style="color:' + (ck.ok?'var(--text)':'var(--muted)') + ';flex:1">' + ck.l + '</span><span style="font-size:9px;color:var(--muted)">' + ck.cat + '</span></div>';
  }
  html += '<div style="margin-top:10px;padding:10px;border-radius:6px;text-align:center;font-size:12px;font-weight:700;background:' + (score>=15?'#22c55e11':score>=12?'#f0b42911':score>=9?'#f9731611':'#ef444411') + ';border:1px solid ' + (score>=15?'#22c55e33':score>=12?'#f0b42933':score>=9?'#f9731633':'#ef444433') + ';color:' + (score>=15?'var(--green)':score>=12?'var(--gold)':score>=9?'var(--orange)':'var(--red)') + '">' + conf + '</div></div>';

  // Wave structure reference
  html += '<div class="card"><div class="ct">YOUR WAVE STRUCTURE — REFERENCE</div><div style="font-size:10px;color:var(--muted);line-height:2">';
  html += '<div>Grand: W1($0.01→$69K) W2($69K→$15.4K) W3($15.4K→ongoing)</div>';
  html += '<div>W3 Internal: W1ofW3($15.4K→$126.2K) W2ofW3(correcting)</div>';
  html += '<div>W2ofW3: A($126.2K→$74.5K) B($74.5K→$95.8K) C(unfolding)</div>';
  html += '<div style="margin-top:6px;color:var(--sub)">Re-entry: Miss W2? Wait for W4 (23–38% retrace of W3)</div>';
  html += '</div></div>';

  show(html);

  // Draw charts
  setTimeout(function() {
    drawPrice(prices, waves, current, sl, [tp1,tp2,tp3,tp4]);
    drawRSI(prices);
    drawMACD(prices);
    drawVol(state.vols);
  }, 100);
}

// ── CHART DRAWING ──────────────────────────────────────────────
function drawPrice(prices, waves, current, sl, tps) {
  var c = document.getElementById('priceChart');
  if (!c) return;
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = c.offsetWidth, H = 260;
  c.width = W*dpr; c.height = H*dpr; c.style.height = H+'px';
  ctx.scale(dpr, dpr);
  var P = { t:16, r:55, b:24, l:58 };
  var cW = W-P.l-P.r, cH = H-P.t-P.b;
  var mn = Math.min.apply(null,prices)*0.97;
  var mx = Math.max.apply(null,prices)*1.03;
  var rng = mx-mn || 1;
  function xS(i) { return P.l + (i/(prices.length-1))*cW; }
  function yS(p) { return P.t + cH - ((p-mn)/rng)*cH; }

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  for (var i = 0; i <= 5; i++) {
    var y = P.t+(i/5)*cH, price = mx-(i/5)*rng;
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(fp(price), P.l-3, y+3);
  }

  var step = Math.max(1, Math.floor(state.data.length/5));
  for (var i = 0; i < state.data.length; i+=step) {
    var d = state.data[i].date;
    var lbl = state.days <= 7 ? d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) :
              state.days <= 30 ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) :
              d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    ctx.fillStyle='#334155'; ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillText(lbl, xS(i), H-4);
  }

  // SL line
  var slY = yS(sl);
  if (slY >= P.t && slY <= P.t+cH) {
    ctx.strokeStyle='#ef444466'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(P.l,slY); ctx.lineTo(P.l+cW,slY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ef4444'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
    ctx.fillText('SL', P.l+cW+2, slY+3);
  }

  // TP lines
  var tpLabels = ['TP1','TP2','TP3','TP4'];
  for (var t = 0; t < tps.length; t++) {
    var tpY = yS(tps[t]);
    if (tpY < P.t || tpY > P.t+cH) continue;
    ctx.strokeStyle='#22c55e44'; ctx.lineWidth=0.8; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(P.l,tpY); ctx.lineTo(P.l+cW,tpY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#22c55e'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
    ctx.fillText(tpLabels[t], P.l+cW+2, tpY+3);
  }

  // Area fill
  var gr = ctx.createLinearGradient(0,P.t,0,P.t+cH);
  gr.addColorStop(0,'rgba(240,180,41,0.18)'); gr.addColorStop(1,'rgba(240,180,41,0.01)');
  ctx.beginPath();
  for (var i = 0; i < prices.length; i++) { i===0 ? ctx.moveTo(xS(i),yS(prices[i])) : ctx.lineTo(xS(i),yS(prices[i])); }
  ctx.lineTo(xS(prices.length-1),P.t+cH); ctx.lineTo(xS(0),P.t+cH);
  ctx.closePath(); ctx.fillStyle=gr; ctx.fill();

  // Price line
  ctx.beginPath(); ctx.strokeStyle='#f0b429'; ctx.lineWidth=2;
  for (var i = 0; i < prices.length; i++) { i===0 ? ctx.moveTo(xS(i),yS(prices[i])) : ctx.lineTo(xS(i),yS(prices[i])); }
  ctx.stroke();

  // Wave lines
  if (waves.length > 1) {
    ctx.beginPath(); ctx.strokeStyle='rgba(240,180,41,0.4)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    for (var i = 0; i < waves.length; i++) { i===0 ? ctx.moveTo(xS(waves[i].idx),yS(waves[i].price)) : ctx.lineTo(xS(waves[i].idx),yS(waves[i].price)); }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Wave labels
  for (var i = 0; i < waves.length; i++) {
    var w = waves[i];
    var x = xS(w.idx), y = yS(w.price);
    var top = w.type === 'peak', off = top ? -22 : 22;
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle=w.color; ctx.fill();
    ctx.fillStyle=w.color; ctx.fillRect(x-17,y+off-9,34,16);
    ctx.fillStyle='#000'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText(w.label, x, y+off+3);
    ctx.fillStyle=w.color; ctx.font='7px monospace';
    ctx.fillText(fp(w.price), x, y+off+(top?-13:19));
  }
}

function drawRSI(prices) {
  var c = document.getElementById('rsiChart');
  if (!c) return;
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = c.offsetWidth, H = 65;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48};
  var cW=W-P.l-P.r, cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  var vals = [];
  for (var i = 14; i < prices.length; i++) vals.push(calcRSI(prices.slice(0,i+1)));
  if (!vals.length) return;

  ctx.fillStyle='#ef444408'; ctx.fillRect(P.l,P.t,cW,(cH-(70/100*cH)));
  ctx.fillStyle='#22c55e08'; ctx.fillRect(P.l,P.t+cH-(30/100*cH),cW,(30/100*cH));

  [30,50,70].forEach(function(v) {
    var y = P.t+cH-(v/100*cH);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
    ctx.fillText(v, P.l-3, y+3);
  });

  function xS(i) { return P.l+(i/(vals.length-1))*cW; }
  function yS(v) { return P.t+cH-(v/100*cH); }

  ctx.beginPath(); ctx.strokeStyle='#f97316'; ctx.lineWidth=1.5;
  for (var i = 0; i < vals.length; i++) { i===0 ? ctx.moveTo(xS(i),yS(vals[i])) : ctx.lineTo(xS(i),yS(vals[i])); }
  ctx.stroke();

  var last = vals[vals.length-1];
  ctx.fillStyle=last<30?'#22c55e':last>70?'#ef4444':'#f97316';
  ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText('RSI ' + last.toFixed(1), P.l+cW+2, P.t+cH/2+3);
  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('RSI 14', P.l-3, P.t+8);
}

function drawMACD(prices) {
  var c = document.getElementById('macdChart');
  if (!c) return;
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = c.offsetWidth, H = 65;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48};
  var cW=W-P.l-P.r, cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);

  var ef=calcEMA(prices,12), es=calcEMA(prices,26), off=26-12;
  if (!ef.length || !es.length) return;
  var ml=[]; for(var i=0;i<es.length;i++) ml.push(ef[i+off]-es[i]);
  var sl=calcEMA(ml,9); if(!sl.length) return;
  var diff=ml.length-sl.length;
  var hist=[]; for(var i=0;i<sl.length;i++) hist.push(ml[i+diff]-sl[i]);

  var mx=Math.max.apply(null,hist.map(Math.abs))*1.1||1;
  var yMid=P.t+cH/2;
  function xS(i){return P.l+(i/(hist.length-1))*cW;}
  function yS(v){return yMid-(v/mx)*(cH/2);}

  ctx.strokeStyle='#334155'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(P.l,yMid); ctx.lineTo(P.l+cW,yMid); ctx.stroke();

  var bw=Math.max(1,cW/hist.length-0.5);
  for(var i=0;i<hist.length;i++){
    var x=xS(i),y=yS(hist[i]);
    ctx.fillStyle=hist[i]>=0?'#22c55e66':'#ef444466';
    ctx.fillRect(x-bw/2,Math.min(y,yMid),bw,Math.abs(y-yMid));
  }

  var last=hist[hist.length-1]||0;
  ctx.fillStyle=last>=0?'#22c55e':'#ef4444';
  ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText('MACD', P.l+cW+2, P.t+cH/2+3);
  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('MACD', P.l-3, P.t+8);
}

function drawVol(vols) {
  var c = document.getElementById('volChart');
  if (!c || !vols.length) return;
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = c.offsetWidth, H = 50;
  c.width=W*dpr; c.height=H*dpr; c.style.height=H+'px';
  ctx.scale(dpr,dpr);
  var P={t:4,r:40,b:16,l:48};
  var cW=W-P.l-P.r, cH=H-P.t-P.b;

  ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);
  var maxV=Math.max.apply(null,vols)||1;
  var bw=Math.max(1,cW/vols.length-0.5);

  for(var i=0;i<vols.length;i++){
    var x=P.l+(i/(vols.length-1))*cW;
    var h=(vols[i]/maxV)*cH;
    var up=i>0&&state.data[i]&&state.data[i-1]&&state.data[i].price>=state.data[i-1].price;
    ctx.fillStyle=up?'#22c55e44':'#ef444444';
    ctx.fillRect(x-bw/2,P.t+cH-h,bw,h);
  }
  ctx.fillStyle='#475569'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText('VOL', P.l-3, P.t+8);
}

function show(h) { document.getElementById('main').innerHTML = h; }
</script>
