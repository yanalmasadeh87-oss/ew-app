<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EW Strategy V7 Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
  }
  .header {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; color: #00ff88; }
  .header .status { font-size: 12px; color: #666; }
  .header .status.online { color: #00ff88; }
  .header .status.offline { color: #ff4444; }
  .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .metric { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
  .metric:last-child { border-bottom: none; }
  .metric .label { color: #666; }
  .metric .value { color: #e0e0e0; font-weight: 500; }
  .metric .value.bull { color: #00ff88; }
  .metric .value.bear { color: #ff4444; }
  .metric .value.warn { color: #ffaa00; }
  .signal-card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .signal-card .sym { font-size: 16px; font-weight: 600; color: #fff; }
  .signal-card .type { font-size: 11px; color: #888; margin-left: 8px; }
  .signal-card .score-bar {
    height: 4px;
    background: #222;
    border-radius: 2px;
    margin: 8px 0;
    overflow: hidden;
  }
  .signal-card .score-bar .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .signal-card .score-bar .fill.high { background: #00ff88; }
  .signal-card .score-bar .fill.med { background: #ffaa00; }
  .signal-card .score-bar .fill.low { background: #ff4444; }
  .signal-card .details { font-size: 12px; color: #888; margin-top: 8px; }
  .signal-card .details .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .signal-card .tps { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .signal-card .tp {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    background: #1a1a1a;
    color: #888;
  }
  .signal-card .tp.hit { background: #00ff8822; color: #00ff88; border: 1px solid #00ff8844; }
  .engine-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #1a1a1a;
    color: #666;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .engine-badge.active { background: #00ff8822; color: #00ff88; }
  .watch-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #1a1a1a;
    font-size: 13px;
  }
  .watch-item:last-child { border-bottom: none; }
  .watch-item .sym { color: #e0e0e0; }
  .watch-item .score { color: #888; font-size: 12px; }
  .refresh-btn {
    background: #222;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .refresh-btn:hover { background: #333; }
  .error { color: #ff4444; font-size: 13px; padding: 20px; text-align: center; }
  .loading { color: #888; font-size: 13px; padding: 20px; text-align: center; }
  .section-title {
    font-size: 14px;
    color: #fff;
    margin: 20px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #222;
  }
  .mtf-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .mtf-item {
    text-align: center;
    padding: 8px;
    background: #1a1a1a;
    border-radius: 4px;
    font-size: 12px;
  }
  .mtf-item .tf { color: #666; font-size: 10px; }
  .mtf-item .dir { color: #e0e0e0; font-weight: 500; }
  .mtf-item .dir.bull { color: #00ff88; }
  .mtf-item .dir.bear { color: #ff4444; }
  .pattern-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #ffaa0022;
    color: #ffaa00;
    margin-right: 4px;
  }
</style>
</head>
<body>
<div class="header">
  <h1>EW Strategy V7 Dashboard</h1>
  <div>
    <span class="status" id="conn-status">Checking...</span>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="container">
  <div id="loading" class="loading">Loading...</div>
  <div id="error" class="error" style="display:none"></div>
  <div id="content" style="display:none">

    <!-- Market Context -->
    <div class="section-title">Market Context</div>
    <div class="grid" id="market-grid"></div>

    <!-- Engine Status -->
    <div class="section-title">V7 Engines</div>
    <div class="card" id="engines-card"></div>

    <!-- Active Signals -->
    <div class="section-title">Active Signals (<span id="sig-count">0</span>)</div>
    <div id="signals-list"></div>

    <!-- Watch List -->
    <div class="section-title">Watch List (<span id="watch-count">0</span>)</div>
    <div class="card" id="watch-card"></div>

    <!-- Stats -->
    <div class="section-title">Stats</div>
    <div class="grid" id="stats-grid"></div>
  </div>
</div>

<script>
const API_BASE = 'https://hal-coins-bot.onrender.com';

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  document.getElementById('content').style.display = 'none';

  try {
    const [statusRes, signalsRes] = await Promise.all([
      fetch(`${API_BASE}/api/status`),
      fetch(`${API_BASE}/api/signals`)
    ]);

    if (!statusRes.ok || !signalsRes.ok) throw new Error('API error');

    const status = await statusRes.json();
    const signals = await signalsRes.json();

    renderStatus(status);
    renderSignals(signals);
    renderWatches(signals);
    renderStats(status, signals);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('conn-status').textContent = 'Online';
    document.getElementById('conn-status').className = 'status online';
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error: ' + err.message;
    document.getElementById('conn-status').textContent = 'Offline';
    document.getElementById('conn-status').className = 'status offline';
  }
}

function renderStatus(data) {
  const ctx = data.market_ctx || {};
  const grid = document.getElementById('market-grid');
  grid.innerHTML = `
    <div class="card">
      <h2>Fear & Greed</h2>
      <div class="metric"><span class="label">Index</span><span class="value ${ctx.fg_now <= 20 ? 'bear' : ctx.fg_now >= 80 ? 'warn' : ''}">${ctx.fg_now || 'N/A'}</span></div>
      <div class="metric"><span class="label">Zone</span><span class="value">${ctx.fg_zone || 'N/A'}</span></div>
      <div class="metric"><span class="label">Trend</span><span class="value ${ctx.fg_trend === 'RISING' ? 'bull' : ctx.fg_trend === 'FALLING' ? 'bear' : ''}">${ctx.fg_trend || 'N/A'}</span></div>
    </div>
    <div class="card">
      <h2>Bitcoin Dominance</h2>
      <div class="metric"><span class="label">BTC.D</span><span class="value">${ctx.btc_dom || 'N/A'}%</span></div>
      <div class="metric"><span class="label">Trend</span><span class="value ${ctx.btc_dom_trend === 'RISING' ? 'bull' : ctx.btc_dom_trend === 'FALLING' ? 'bear' : ''}">${ctx.btc_dom_trend || 'N/A'}</span></div>
    </div>
    <div class="card">
      <h2>Market Cap</h2>
      <div class="metric"><span class="label">Total</span><span class="value">${ctx.total ? '$' + (ctx.total / 1e12).toFixed(2) + 'T' : 'N/A'}</span></div>
      <div class="metric"><span class="label">Trend</span><span class="value ${ctx.total_trend === 'RISING' ? 'bull' : ctx.total_trend === 'FALLING' ? 'bear' : ''}">${ctx.total_trend || 'N/A'}</span></div>
    </div>
  `;

  const engines = data.engine_data || {};
  const enginesCard = document.getElementById('engines-card');
  enginesCard.innerHTML = Object.entries(engines).map(([k, v]) =>
    `<span class="engine-badge active">${k}: ${v}</span>`
  ).join('');
}

function renderSignals(data) {
  const signals = data.signals || [];
  document.getElementById('sig-count').textContent = signals.length;
  const list = document.getElementById('signals-list');

  if (signals.length === 0) {
    list.innerHTML = '<div class="card" style="color:#666;font-size:13px;">No active signals</div>';
    return;
  }

  list.innerHTML = signals.map(s => {
    const score = s.score || 0;
    const scoreClass = score >= 85 ? 'high' : score >= 55 ? 'med' : 'low';
    const entry = s.entry ? '$' + s.entry.toFixed(2) : 'N/A';

    // V7 engine data (underscore-prefixed from API)
    const mtf = s._mtf_alignment || {};
    const patterns = s._candlestick_patterns || [];
    const extWave = s._extended_wave || {};
    const liq = s._liquidity_info || {};

    let mtfHtml = '';
    if (mtf && mtf['1d']) {
      mtfHtml = `<div class="mtf-grid">
        <div class="mtf-item"><div class="tf">1D</div><div class="dir ${(mtf['1d'] || '').includes('bull') ? 'bull' : (mtf['1d'] || '').includes('bear') ? 'bear' : ''}">${mtf['1d'] || '?'}</div></div>
        <div class="mtf-item"><div class="tf">4H</div><div class="dir ${(mtf['4h'] || '').includes('bull') ? 'bull' : (mtf['4h'] || '').includes('bear') ? 'bear' : ''}">${mtf['4h'] || '?'}</div></div>
        <div class="mtf-item"><div class="tf">1H</div><div class="dir ${(mtf['1h'] || '').includes('bull') ? 'bull' : (mtf['1h'] || '').includes('bear') ? 'bear' : ''}">${mtf['1h'] || '?'}</div></div>
      </div>`;
    }

    let patternsHtml = '';
    if (patterns.length > 0) {
      patternsHtml = `<div style="margin-top:8px">${patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('')}</div>`;
    }

    let extHtml = '';
    if (extWave.extended) {
      extHtml = `<div class="metric" style="margin-top:8px"><span class="label">Extended Wave</span><span class="value bull">${extWave.label || ''}</span></div>`;
    }

    let liqHtml = '';
    if (liq.choch) {
      liqHtml = `<span class="engine-badge active" style="margin-top:8px;display:inline-block">CHoCH: Bullish</span>`;
    } else if (liq.bos) {
      liqHtml = `<span class="engine-badge active" style="margin-top:8px;display:inline-block">BOS: Bullish</span>`;
    }

    return `
      <div class="signal-card">
        <div><span class="sym">${s.sym || '?'}</span><span class="type">${s.type || ''}</span></div>
        <div class="score-bar"><div class="fill ${scoreClass}" style="width:${score}%"></div></div>
        <div class="details">
          <div class="row"><span>Score: ${score}/100</span><span>${s.conf || '?'}</span></div>
          <div class="row"><span>Structure: ${s.struct_label || '?'}</span><span>Phase: ${s.phase || '?'}</span></div>
          <div class="row"><span>Entry: ${entry}</span><span>RSI: ${s.rsi ? s.rsi.toFixed(0) : '?'}</span></div>
          ${mtfHtml}
          ${patternsHtml}
          ${extHtml}
          ${liqHtml}
        </div>
        <div class="tps">
          <span class="tp ${s.hit_tp1 ? 'hit' : ''}">TP1: ${s.tp1 ? '$' + s.tp1.toFixed(2) : '?'}</span>
          <span class="tp ${s.hit_tp2 ? 'hit' : ''}">TP2: ${s.tp2 ? '$' + s.tp2.toFixed(2) : '?'}</span>
          <span class="tp ${s.hit_tp3 ? 'hit' : ''}">TP3: ${s.tp3 ? '$' + s.tp3.toFixed(2) : '?'}</span>
          <span class="tp ${s.hit_tp4 ? 'hit' : ''}">TP4: ${s.tp4 ? '$' + s.tp4.toFixed(2) : '?'}</span>
          <span class="tp" style="color:#ff4444">SL: ${s.sl ? '$' + s.sl.toFixed(2) : '?'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderWatches(data) {
  const watches = data.watches || [];
  document.getElementById('watch-count').textContent = watches.length;
  const card = document.getElementById('watch-card');

  if (watches.length === 0) {
    card.innerHTML = '<div style="color:#666;font-size:13px;">No watches</div>';
    return;
  }

  card.innerHTML = watches.map(w => `
    <div class="watch-item">
      <span class="sym">${w.sym || '?'}</span>
      <span class="score">${w.type || ''}</span>
    </div>
  `).join('');
}

function renderStats(status, signals) {
  const stats = signals.stats || {};
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="card">
      <h2>Bot Stats</h2>
      <div class="metric"><span class="label">Version</span><span class="value">${status.version || '?'}</span></div>
      <div class="metric"><span class="label">Scans</span><span class="value">${status.scan_count || 0}</span></div>
      <div class="metric"><span class="label">Signals Sent</span><span class="value">${status.sent_signals_count || 0}</span></div>
      <div class="metric"><span class="label">Watches Sent</span><span class="value">${status.sent_watches_count || 0}</span></div>
    </div>
    <div class="card">
      <h2>Trade Stats</h2>
      <div class="metric"><span class="label">Active</span><span class="value">${stats.trades || 0}</span></div>
      <div class="metric"><span class="label">Signals</span><span class="value">${stats.signals || 0}</span></div>
      <div class="metric"><span class="label">Watches</span><span class="value">${stats.watches || 0}</span></div>
      <div class="metric"><span class="label">Scans</span><span class="value">${stats.scans || 0}</span></div>
    </div>
  `;
}

// Auto-refresh every 30 seconds
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
